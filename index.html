<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thornhold: Relics of the Warlord</title><link rel=icon href=favicon.svg><style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;background:#1d1610 radial-gradient(circle at 30% 20%,#3a2a1a 0,#1d1610 70%);color:#f3e6c8;min-height:100vh}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{font-family:"Cinzel","Trajan Pro",Georgia,serif;letter-spacing:.04em;margin:.2em 0}
.btn{background:linear-gradient(#6b4a22,#4a3115);color:#fbe9bd;border:1px solid #c99a4a;border-radius:6px;padding:7px 13px;font-size:14px;margin:3px;box-shadow:0 2px 0 #2a1a08}
.btn:hover:not(:disabled){background:linear-gradient(#83592a,#5c3d1a)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(#b8862f,#8a5f17);color:#1d1306;font-weight:bold}
.btn.danger{background:linear-gradient(#8a2a22,#5e1813);border-color:#d26a5a}
.btn.small{padding:3px 8px;font-size:12px}
.wrap{max-width:1400px;margin:0 auto;padding:10px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:rgba(0,0,0,.35);border:1px solid #6b4f2a;border-radius:10px;padding:8px 14px}
.topbar h1{font-size:22px;color:#e8c46a;margin-right:auto}
.doom{display:flex;align-items:center;gap:6px;font-size:13px}
.doomtrack{display:flex;gap:2px}
.doomtrack span{width:13px;height:16px;border-radius:2px;background:#3b2c1c;border:1px solid #6b4f2a}
.doomtrack span.on{background:#b3261e;border-color:#ff7b6b}
.doomtrack span.mile{outline:1px solid #e8c46a}
.seals{display:flex;gap:5px;font-size:12px}
.seal{padding:2px 7px;border-radius:10px;border:1px solid #7a2f8a;background:#3b1744}
.seal.broken{background:#2a3a22;border-color:#6fa35b;text-decoration:line-through;opacity:.75}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;margin-top:10px}
@media(max-width:1000px){.main{grid-template-columns:1fr}}
.panel{background:rgba(245,230,195,.06);border:1px solid #6b4f2a;border-radius:10px;padding:10px}
.boardwrap{background:#c9b48a url();border-radius:12px;border:3px solid #5b3d1c;box-shadow:inset 0 0 60px rgba(60,35,10,.55);background:radial-gradient(circle at 50% 40%,#e3d2a8,#b99c68)}
svg.board{width:100%;height:auto;display:block}
.node{cursor:default}
.node.reach{cursor:pointer}
.node.reach circle.ring{stroke:#ffd85a;stroke-width:5;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.35}}
.locpanel{margin-top:10px}
.locpanel .desc{font-size:14px;color:#e5d4ad;margin:4px 0}
.locpanel .region{font-size:13px;color:#a9d48f;font-style:italic}
.player{border:1px solid #6b4f2a;border-radius:8px;padding:8px;margin-bottom:8px;background:rgba(0,0,0,.25)}
.player.active{border-color:#e8c46a;box-shadow:0 0 10px rgba(232,196,106,.35)}
.player .pname{font-weight:bold;font-size:16px}
.bar{height:10px;background:#3b2c1c;border-radius:5px;overflow:hidden;border:1px solid #000;margin:3px 0}
.bar>i{display:block;height:100%;background:linear-gradient(#e04a3a,#a3221a)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:11px;padding:2px 7px;border-radius:10px;background:#4a3518;border:1px solid #c99a4a;cursor:help}
.chip.relic{background:#2b3f5a;border-color:#7fb2e6}
.chip.perk{background:#40351a;border-color:#e8c46a}
.chip.eperk{background:#4a1a1a;border-color:#d26a5a}
.chip.quest{background:#2f4a2a;border-color:#8fc57a}
.log{font-size:12px;max-height:300px;overflow:auto;line-height:1.45;background:rgba(0,0,0,.3);padding:6px;border-radius:6px}
.log div{border-bottom:1px dotted #4a3a24;padding:1px 0}
.overlay{position:fixed;inset:0;background:rgba(10,6,2,.82);display:flex;align-items:flex-start;justify-content:center;overflow:auto;z-index:10;padding:20px 8px}
.modal{background:linear-gradient(#3a2a18,#241a0f);border:2px solid #c99a4a;border-radius:12px;padding:16px;max-width:1150px;width:100%;box-shadow:0 10px 40px #000}
.modal h2{color:#e8c46a}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.card{width:132px;min-height:188px;border-radius:9px;background:linear-gradient(#f6ecd2,#dcc89c);color:#2a1a0a;border:3px solid #7a5a2a;position:relative;padding:22px 7px 26px;font-size:12px;box-shadow:0 3px 8px rgba(0,0,0,.6);display:flex;flex-direction:column;transition:transform .12s}
.card.play{cursor:pointer}
.card.play:hover{transform:translateY(-6px)}
/* Combat hand: never move the card's hit box on hover (that looped zoom-in/out on laptops). */
.combat-hand .card.play:hover{transform:none}
.combat-hand .play-row .card.play:hover,
.combat-hand .play-row .card:hover,
.combat-hand .play-row .card:focus-visible{
  transform:rotate(var(--ang)) translateY(var(--drop));
  z-index:8;
}
.combat-hand .play-row .card:hover .cardface,
.combat-hand .mana-row .card:hover .cardface{
  transform:translateY(-14px) scale(1.05);
  transform-origin:50% 100%;
  pointer-events:none;
}
.card.cant{opacity:.55;filter:grayscale(.5)}
.card .mana{position:absolute;top:-9px;left:-9px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8fd0ff,#1f5fa8);color:#fff;font-weight:bold;display:flex;align-items:center;justify-content:center;border:2px solid #0c2c55;font-size:15px}
.card .cost{position:absolute;bottom:-9px;right:-9px;min-width:30px;height:28px;border-radius:14px;padding:0 5px;background:radial-gradient(circle at 35% 30%,#ffe58a,#b8860b);color:#3a2500;font-weight:bold;display:flex;align-items:center;justify-content:center;border:2px solid #6b4a00;font-size:13px}
.card .cname{font-weight:bold;font-size:13px;text-align:center;line-height:1.15}
.card .ctype{font-size:10px;text-align:center;text-transform:uppercase;letter-spacing:.08em;color:#6b4a22;margin:2px 0}
.card .art{text-align:center;font-size:30px;margin:4px 0;border-radius:6px;background:rgba(0,0,0,.08);padding:4px 0}
.card .ctext{font-size:11.5px;line-height:1.3;text-align:center;flex:1}
.card .tier{position:absolute;bottom:3px;left:7px;font-size:10px;color:#6b4a22}
.card.druid{border-color:#3f7d3a}.card.elf{border-color:#2f7a8c}.card.warlock{border-color:#6b2f8a}.card.dwarf{border-color:#8a5a2b}.card.neutral{border-color:#7a6a50}
.card.relic{background:linear-gradient(#e3ecf7,#b7c9e0);border-color:#2b4f7a}
.card.perk{background:linear-gradient(#fbefc4,#e2c56e);border-color:#8a6a10}
.card .buy{margin-top:6px;text-align:center}
.enemy{width:150px;border-radius:9px;background:linear-gradient(#3b1d1d,#1f0e0e);border:3px solid #7a2a2a;padding:8px;color:#f3d6c8;cursor:pointer;position:relative;font-size:12px}
.enemy.boss{width:200px;border-color:#b8862f;background:linear-gradient(#2a0f33,#120616)}
.enemy.tgt{box-shadow:0 0 0 3px #ffd85a,0 0 18px #ffd85a}
.enemy.dead{opacity:.25;cursor:default;filter:grayscale(1)}
.enemy .ename{font-weight:bold;font-size:14px}
.enemy .stats{display:flex;gap:8px;margin:4px 0;font-size:13px}
.enemy .abil{font-size:11px;color:#d8b5a5;font-style:italic}
.tag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:6px;background:#5a4a20;margin:1px}
.fighters{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.fighter{border:1px solid #6b4f2a;border-radius:8px;padding:6px 10px;background:rgba(0,0,0,.3);min-width:220px}
.fighter.act{border-color:#e8c46a}
.creature{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;background:#2f4a2a;border:1px solid #8fc57a;margin:2px}
.manabar{display:inline-flex;gap:3px;vertical-align:middle}
.manabar i{width:14px;height:14px;border-radius:50%;background:#1f5fa8;border:1px solid #8fd0ff;display:inline-block}
.manabar i.off{background:#222;border-color:#444}
.clog{font-size:12px;max-height:120px;overflow:auto;background:rgba(0,0,0,.35);padding:6px;border-radius:6px;line-height:1.4}
.setup .fac{display:inline-block;width:200px;border:2px solid #6b4f2a;border-radius:10px;padding:10px;margin:6px;cursor:pointer;background:rgba(0,0,0,.25);vertical-align:top}
.setup .fac.sel{border-color:#e8c46a;box-shadow:0 0 12px #e8c46a}
.setup .fac .ic{font-size:36px}
.endscreen{text-align:center;padding:40px}
.endscreen h1{font-size:46px}
.muted{color:#b9a47c;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.decklist{display:flex;flex-wrap:wrap;gap:6px}
.decklist .dl{font-size:12px;border:1px solid #6b4f2a;border-radius:6px;padding:3px 6px;background:rgba(0,0,0,.25)}
.help{font-size:13px;line-height:1.5}
.help summary{cursor:pointer;color:#e8c46a}
.err{background:#5e1813;color:#fff;padding:6px;border-radius:6px;margin:6px 0;font-size:12px}

.crs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mini{width:110px;padding:4px 6px;border-radius:7px;background:#2f4a2a;border:1px solid #8fc57a;font-size:11px;line-height:1.25}
.mini.token{border-style:dashed;background:#2a3d2a}
.mini.artf{background:#3d3a33;border-color:#c9a45a}
.mini .mn{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .kw{color:#e6d9a8;font-size:10px;min-height:12px}
.mini .pt{font-weight:bold;font-size:14px;text-align:right}
.mini .ctr{font-size:10px;background:#5b7d2a;border-radius:4px;padding:0 3px}
.respond{border:2px solid #d4a017;background:#3a2a12}
/* ===== v3 additions ===== */
.card{width:138px}
.card .mana{background:radial-gradient(circle at 35% 30%,#8fd0ff,#1f5fa8)}
.card.creature{background:linear-gradient(#eef3dc,#c9d6a4)}
.card.spell,.card.instant{background:linear-gradient(#ecebf8,#c3c3e6)}
.card.artifact,.card.equipment{background:linear-gradient(#f4eadb,#d9c3a0)}
.card.manac{background:linear-gradient(#e2f0fb,#a9cbe8);border-color:#1f5fa8}
.card.junk{background:linear-gradient(#ddd,#aaa);border-color:#666}
.card .pt{position:absolute;bottom:4px;left:8px;font-weight:bold;font-size:15px}
.card .stars{position:absolute;top:2px;right:6px;color:#b8860b;font-size:12px}
.card.sel{box-shadow:0 0 0 3px #ffd85a,0 0 14px #ffd85a}
.gauntlet{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0;padding:8px;border-radius:10px;background:rgba(90,20,20,.25);border:1px solid #7a2a2a}
.gstop{padding:6px 10px;border-radius:8px;border:2px solid #6b1e1e;background:#3a1212;font-size:13px}
.gstop.done{background:#2a3a22;border-color:#6fa35b;text-decoration:line-through;opacity:.8}
.gstop.next{border-color:#ffd85a;box-shadow:0 0 10px rgba(255,216,90,.5)}
.gstop.lock{opacity:.6}
.cr{width:118px;padding:5px 6px;border-radius:8px;background:#2f4a2a;border:2px solid #8fc57a;font-size:11px;line-height:1.25;cursor:pointer;position:relative;transition:transform .15s}
.cr.boss{background:#4a1f1f;border-color:#d26a5a}
.cr.token{border-style:dashed}
.cr.tapped{transform:rotate(9deg);opacity:.6;filter:saturate(.5)}
.cr.atk{box-shadow:0 0 0 3px #ff6a3a,0 0 14px #ff6a3a}
.cr.ally{box-shadow:0 0 0 3px #7fd3ff,0 0 12px #7fd3ff}
.cr.tgt{box-shadow:0 0 0 3px #ffd85a,0 0 14px #ffd85a}
.cr .mn{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr .kw{color:#e6d9a8;font-size:10px;min-height:12px}
.cr .pt{font-weight:bold;font-size:15px;text-align:right}
.cr .eq{font-size:10px;color:#ffd9a0}
.cr .sh{position:absolute;top:-8px;right:-6px;background:#5a7fa8;border:1px solid #cfe6ff;border-radius:10px;padding:0 5px;font-size:11px;font-weight:bold}
.field{display:flex;flex-wrap:wrap;gap:8px;min-height:30px;padding:6px;border-radius:8px;background:rgba(0,0,0,.2)}
.bosspanel{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;padding:10px;border-radius:10px;background:linear-gradient(#2a0f33,#120616);border:2px solid #b8862f}
.bosspanel .bname{font-size:20px;font-weight:bold;color:#e8c46a}
.bossbox{cursor:pointer;padding:6px;border-radius:8px}
.bossbox.tgt{box-shadow:0 0 0 3px #ffd85a,0 0 14px #ffd85a}
.phase{font-size:16px;padding:8px 12px;border-radius:8px;background:#3a2a12;border:1px solid #c99a4a;margin:8px 0}
.awaken-banner{margin:8px 0 0;padding:10px 14px;border-radius:8px;text-align:center;font-size:18px;font-weight:bold;letter-spacing:.02em;color:#1a1204;background:linear-gradient(#ffe9a0,#c99a4a);border:2px solid #ffd85a;box-shadow:0 0 18px rgba(255,216,90,.55);animation:awakenpop .45s ease-out}
@keyframes awakenpop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.cr.artcr.awakened{box-shadow:0 0 0 3px #ffd85a,0 0 16px #ffe9a0}
.cr.artcr.awaken-flash{animation:awakenflash 1.1s ease-out}
@keyframes awakenflash{0%{box-shadow:0 0 0 6px #fff6c8,0 0 28px #ffd85a;filter:brightness(1.35)}100%{box-shadow:0 0 0 3px #ffd85a,0 0 16px #ffe9a0;filter:none}}
.atkrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border-radius:8px;border:1px solid #6b4f2a;margin:4px 0;background:rgba(0,0,0,.25);cursor:pointer}
.atkrow.sel{border-color:#ffd85a;background:rgba(80,60,10,.4)}
.atkrow.cancel{opacity:.5;text-decoration:line-through}
.eventcard{max-width:460px;width:90%;margin:auto;text-align:center;border-radius:16px;padding:24px;border:4px solid #c99a4a;background:linear-gradient(#f6ecd2,#dcc89c);color:#2a1a0a;box-shadow:0 10px 50px #000;animation:pop .35s ease-out}
.eventcard.bad{border-color:#a3221a;background:linear-gradient(#f6d8d2,#dca89c)}
.eventcard.good{border-color:#3f7d3a;background:linear-gradient(#e6f6d2,#b9dc9c)}
.eventcard .big{font-size:96px}
.eventcard h2{color:#2a1a0a!important;font-size:32px}
.eventcard p{font-size:17px}
.eventcard .res{font-size:20px;font-weight:bold;margin:12px 0}
@keyframes pop{0%{transform:scale(.4) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.tabs{display:flex;gap:6px;margin:6px 0}
.mats{display:inline-flex;gap:8px;font-size:12px}
.uprow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border-bottom:1px dotted #6b4f2a;padding:4px 0}
.ready{font-size:12px;padding:4px 8px;border-radius:6px;background:rgba(0,0,0,.3);border:1px solid #6b4f2a;margin:4px 0}
.diffsel .fac{width:180px}

/* ===== Finished card art ===== */
.card.artcard{width:138px;min-height:0;height:auto;padding:0;border:none;background:transparent;box-shadow:0 3px 10px rgba(0,0,0,.7);overflow:visible}
.card.artcard .cardface{width:100%;height:auto;display:block;border-radius:8px;pointer-events:none;user-select:none}
.card.artcard .stars{top:6px;right:8px;text-shadow:0 1px 3px #000}
.card.artcard .why{position:absolute;left:6px;right:6px;bottom:28px;background:rgba(20,10,0,.8);color:#ffd9a0;font-size:10px;padding:3px 5px;border-radius:4px;text-align:center;pointer-events:none}
.card.artcard .buy{position:absolute;left:0;right:0;bottom:10px;margin:0}
.zoom-btn{position:absolute;top:6px;left:6px;z-index:2;width:22px;height:22px;border:0;border-radius:11px;background:rgba(0,0,0,.55);color:#f6ecd2;font-size:11px;line-height:22px;padding:0;cursor:pointer;opacity:.85}
.zoom-btn:hover{background:rgba(40,24,8,.9);opacity:1}
.card.artcard .up-tag{position:absolute;left:6px;right:6px;bottom:36px;color:#ffe08a;font-size:10px;text-align:center;text-shadow:0 1px 3px #000;pointer-events:none}

.cr.artcr{width:92px;padding:0 0 22px;overflow:visible;background:#1a120c;border-width:2px}
.cr.artcr .cr-face{width:100%;display:block;border-radius:6px 6px 0 0;pointer-events:none;user-select:none}
.cr.artcr .mn,.cr.artcr .kw,.cr.artcr .eq{display:none}
.cr.artcr .pt{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:13px;color:#f6ecd2;text-shadow:0 1px 3px #000}
.cr.artcr .zoom-btn{top:4px;left:4px;width:18px;height:18px;font-size:10px;line-height:18px}

.chip.artchip{display:inline-flex;align-items:center;gap:4px;padding:2px 6px 2px 2px}
.chip.artchip img{width:28px;height:44px;object-fit:cover;border-radius:3px;display:block}

.setup .fac{width:220px}
.setup .fac .hero-art{width:100%;border-radius:8px;margin:0 0 8px;display:block;box-shadow:0 2px 8px #000}

.player .hero-mini{width:44px;height:68px;object-fit:cover;border-radius:5px;float:right;margin:0 0 4px 8px;cursor:pointer;box-shadow:0 2px 6px #000}

.bosspanel{display:flex;gap:12px;align-items:flex-start}
.bossbox{display:flex;gap:10px;align-items:flex-start}
.bossbox .boss-art{width:110px;height:auto;border-radius:8px;display:block;box-shadow:0 2px 8px #000;flex:none}

#cardzoom{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:80;pointer-events:none}
#cardzoom.show{display:flex}
#cardzoom.pinned{pointer-events:auto;background:rgba(8,4,2,.72)}
#cardzoom img{max-width:min(520px,92vw);max-height:92vh;height:auto;border-radius:14px;box-shadow:0 12px 40px #000;pointer-events:none}
#cardzoom .cardzoom-close{display:none;position:fixed;top:16px;right:18px;width:40px;height:40px;border:0;border-radius:20px;background:#3a2a18;color:#f6ecd2;font-size:24px;cursor:pointer}
#cardzoom.pinned .cardzoom-close{display:block}

/* ===== Combat table layout: full cards on the board, hand docked low ===== */
.overlay.combat-ov{
  padding:6px;
  align-items:stretch;
  justify-content:center;
  overflow:hidden;
  background:rgba(8,5,2,.96);
}
.modal.combat-modal{
  max-width:min(1480px,100%);
  width:100%;
  height:100%;
  max-height:100%;
  display:flex;
  flex-direction:column;
  padding:8px 10px 0;
  overflow:hidden;
  --table-card-w:128px;
  --hand-card-w:118px;
}
.combat-table{
  flex:1 1 auto;
  min-height:0;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.combat-modal .bosspanel{
  display:flex;
  flex-wrap:nowrap;
  gap:10px;
  align-items:flex-start;
  padding:6px 8px;
  flex:0 0 auto;
}
.combat-modal .bossbox{display:flex;gap:8px;align-items:flex-start;flex:0 1 auto;min-width:0;max-width:52%}
.combat-modal .bossbox .boss-art{width:72px;height:auto;border-radius:6px;flex:none}
.combat-modal .bosspanel .bname{font-size:16px;line-height:1.2}
.combat-modal .bstats{font-size:12px;color:#e6d9a8}
.bstats-short{display:none}
.combat-modal .bar{width:min(260px,100%)}
.combat-modal .clog{
  flex:1 1 200px;
  min-width:160px;
  max-width:360px;
  max-height:78px;
  margin:0;
  font-size:11px;
}
.combat-modal .phase{font-size:14px;padding:6px 10px;margin:0;flex:0 0 auto}
.combat-fields{display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-height:0}
.battle-row{flex:0 0 auto;width:100%;min-width:0;overflow:hidden}
.battle-row.ours.act .muted{color:#e8c46a}
.hero-fields{display:flex;flex-direction:row;flex-wrap:nowrap;gap:8px;flex:1 1 auto;min-height:0;align-items:stretch}
.combat-fields.multi .hero-fields .battle-row.ours{flex:1 1 0;width:auto;min-width:0;overflow:auto}
.combat-fields.multi .hero-fields .field{overflow:visible;min-height:0}
.field-stats{display:inline}
.combat-modal .field{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:flex-end;
  gap:8px;
  min-height:0;
  padding:16px 10px 18px;
  overflow:hidden;
}
.cr.tapped, .cr.artcr.tapped{transform-origin:center center}

function setSeed(s){ SEED = Math.abs(Math.floor(s)) % 2147483646 + 1; }

const ri = n => Math.floor(rnd() * n);
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=ri(i+1); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
const pick = a => a[ri(a.length)];

// ===== Quests (pay materials plus a little gold) =====
const QUESTS = [
  {id:'wolfDen',name:'Clear the Wolf Den',type:'fight',boss:'direAlpha',reward:{gold:2,mats:{hide:2}},text:'Fight the Dire Wolf Alpha. Every hero who fights gets 2 Hide and 2 gold.'},

  {id:'crypt',name:'Cleanse the Crypt',type:'fight',boss:'cryptKeeper',reward:{gold:2,mats:{ash:2}},text:'Fight the Crypt Keeper. Every hero who fights gets 2 Soul Ash and 2 gold.'},

  {id:'bandits',name:'Bandits in the Deep',type:'fight',boss:'banditBoss',reward:{gold:3,mats:{iron:2}},text:'Fight the Mine Bandit Boss. Every hero who fights gets 2 Iron and 3 gold.'},
  {id:'apprentice',name:'The Rogue Apprentice',type:'fight',boss:'apprentice',reward:{gold:2,mats:{rune:2}},text:'Fight a Rogue Apprentice. Every hero who fights gets 2 Rune Shards and 2 gold.'},

// ===== Thornhold v3 — game logic (board) =====
let G = null;
let UI = {setup:{count:2, facs:['druid','dwarf','elf','warlock'], decks:['wildPack','ironHold','skyblade','bloodBone'], names:['Player 1','Player 2','Player 3','Player 4'], diff:'medium', drawOrder:'purchase'}, deckView:null, err:null, sel:null};

function log(msg){ if(!G) return; G.log.unshift(msg); if(G.log.length>300) G.log.length=300; if(G.combat){ G.combat.log.unshift(msg); if(G.combat.log.length>80) G.combat.log.length=80; } }
const P = () => G.players[G.cur];
const NP = () => G.players.length;
const alive = p => !p.dead;
const hasRelic = (p,id) => p.relics.includes(id);
const suddenDeath = () => G.round > ROUND_LIMIT;
const nextUid = () => ++G.uid;
const DIFF = () => DIFFS[G.diff];
const escalation = () => ESCALATE_ROUNDS.filter(r=>G.round>=r).length;

function mkInst(id){ return {u:nextUid(), id, up:[]}; }
function buildSupply(deckId){
  const D=DECKS[deckId], S={creature:[],spell:[],artifact:[]};
  for(const s of ['creature','spell','artifact']) for(const id in D[s]) for(let i=0;i<D[s][id];i++) S[s].push(mkInst(id));
  for(const s in S) shuffle(S[s]);
  return S;
}
function returnToSupply(p, inst){
  const c=HC[inst.id]; if(!c || c.junk || c.basic) return;
  const st=p.supply[c.stack]; st.splice(ri(st.length+1),0,inst);
}
function addOwned(p, inst){ inst.b = ++p.buySeq; p.owned.push(inst); }
function ownedSorted(p){ return p.owned.slice().sort((a,b)=>a.b-b.b); }
function deckCounts(p){
  const o={creature:0,spell:0,artifact:0}; for(const i of p.owned) o[HC[i.id].stack]++;
  return {total:p.owned.length, ...o, mana:p.mana.length, supply:p.supply.creature.length+p.supply.spell.length+p.supply.artifact.length, exiled:p.exiled};
}

function dealSpaces(){
  const bag=[]; for(const k of Object.keys(SPACE_MIX)) for(let i=0;i<SPACE_MIX[k];i++) bag.push(k);
  shuffle(bag); const out={}; SPACE_IDS.forEach((id,i)=>out[id]=bag[i%bag.length]); return out;
}
function buildTavernStack(){ const a=[]; for(const k in TAVERN_SPECIALS) for(let i=0;i<TAVERN_SPECIALS[k];i++) a.push(k); return shuffle(a); }

function giveStarterKit(p){
  for(let k=0;k<START_MANA_CARDS;k++) p.mana.push('plain');
  const counts=starterCountsForFac(p.fac);
  const ids=Object.keys(counts);
  if(!ids.length){ for(const id of STARTER_ONES) addOwned(p, mkInst(id)); return; }
  for(const id of ids){ for(let i=0;i<counts[id];i++) addOwned(p, mkInst(id)); }
}

function newGame(count, facs, names, decks, diff, drawOrder){
  G = {players:[], cur:0, round:0, cleared:[false,false,false], log:[], flags:{}, combat:null, modals:[], over:null, turn:null, uid:0,
       diff: diff||'medium', drawOrder: drawOrder||'purchase', herald:0, lastEvent:null, stats:{fights:[]},
       eventDeck:shuffle(ROUND_EVENTS.map(d=>d.id)), questDeck:shuffle(QUESTS.map(q=>q.id)), tavern:buildTavernStack(), spaces:dealSpaces()};
  for(let i=0;i<count;i++){
    const fac=facs[i], deckId=(decks&&decks[i])||DECK_IDS[i%4], solo=count===1;
    const p={idx:i, name:(names&&names[i])||('Player '+(i+1)), fac, deckId, hp:START_HP+(solo?SOLO_HP:0), maxHp:START_HP+(solo?SOLO_HP:0), gold:START_GOLD,
      mats:{iron:0,hide:0,rune:0,ash:0}, supply:buildSupply(deckId), owned:[], buySeq:0, mana:[], relics:FACTIONS[fac].relics.slice(), quests:[], loc:'cross',
      lastUse:null, blessed:0, dead:false, kos:0, exiled:0, bought:0};
    giveStarterKit(p);
    G.players.push(p);
  }
  log(`A new game begins on ${DIFFS[G.diff].name}: ${G.players.map(p=>`${p.name} (${FACTIONS[p.fac].one}, ${DECKS[p.deckId].name} deck)`).join(', ')}. Defeat Malgrath within ${ROUND_LIMIT} rounds, or fight on with permanent death.`);
  beginRound();
  beginTurn();
}

// Town-map fights reuse the same combat rules and the same starter kit as a new game.
// They do not start a board-game campaign. Marked as kind:'town' so leaveCombat skips campaign rewards.
function giveTownLoadout(p, slot){
  const deck=slot&&slot.deck;
  const cards=deck&&deck.cards;
  if(cards&&typeof cards==='object'){
    p.mana=[]; p.owned=[]; p.buySeq=0;
    for(const id of Object.keys(cards)){
      if(!HC[id]) continue;
      const n=Math.max(0,Math.floor(+cards[id]||0));
      for(let i=0;i<n;i++) addOwned(p, mkInst(id));
    }
    if(!p.owned.length) giveStarterKit(p);
    else p.mana=(deck.mana&&deck.mana.length)?deck.mana.slice():['plain','plain','plain'];
  } else {
    giveStarterKit(p);
  }
  // relics: an array (even empty) is the player's unlocked set. Missing means an old client, so use the faction's three.
  if(Array.isArray(slot&&slot.relics)) p.relics=slot.relics.filter(id=>RELICS[id]);
  else p.relics=FACTIONS[p.fac].relics.slice();
}
function startTownFight(cfg){
  const names=cfg.players.map(p=>p.name), facs=cfg.players.map(p=>p.fac), decks=cfg.players.map(p=>p.deckId);
  const count=cfg.players.length, diff=cfg.diff||'medium', seed=cfg.seed||(Date.now()%2147483646)+1;
  setSeed(seed);
  G = {players:[], cur:0, round:1, cleared:[false,false,false], log:[], flags:{}, combat:null, modals:[], over:null,
       turn:{roll:0,moved:true,acted:false,mud:false,flex:0}, uid:0, diff, drawOrder:cfg.drawOrder||'purchase', herald:0,
       lastEvent:null, stats:{fights:[]}, eventDeck:[], questDeck:[], tavern:[], spaces:{}, town:cfg.town||null, seed};
  for(let i=0;i<count;i++){
    const fac=facs[i], deckId=decks[i]||DECK_IDS[i%4], solo=count===1;
    const p={idx:i, name:names[i]||('Player '+(i+1)), fac, deckId, hp:START_HP+(solo?SOLO_HP:0), maxHp:START_HP+(solo?SOLO_HP:0), gold:START_GOLD,
      mats:{iron:0,hide:0,rune:0,ash:0}, supply:buildSupply(deckId), owned:[], buySeq:0, mana:[], relics:[], quests:[], loc:'cross',
      lastUse:null, blessed:0, dead:false, kos:0, exiled:0, bought:0};
    giveTownLoadout(p, cfg.players[i]);
    G.players.push(p);
  }
  const who=G.players.map(p=>{
    const rel=p.relics.length?('relics: '+p.relics.map(r=>RELICS[r].name).join(', ')):('no relics');
    return p.name+' ('+FACTIONS[p.fac].one+', '+rel+')';
  }).join(', ');
  log('A town fight begins on '+DIFFS[G.diff].name+': '+who+' vs '+COMMANDERS[cfg.cid].name+'.');
  startCombat({kind:'town', cid:cfg.cid, town:cfg.town||null}, G.players);
  return G;
}


function beginRound(){
  G.round++; G.flags={};
  log(`══ Round ${G.round}${G.round<=ROUND_LIMIT?' of '+ROUND_LIMIT:' (sudden death)'} ══`);
  if(G.round===ROUND_LIMIT+1) log(`☠ Round ${ROUND_LIMIT} has passed. From now on a hero who falls is dead for good.`);
  if(ESCALATE_ROUNDS.includes(G.round)) log(`⚠ Escalation ${escalation()}: every commander now has +${escalation()*10}% HP.`);
  if(G.eventDeck.length===0) G.eventDeck=shuffle(ROUND_EVENTS.map(d=>d.id));
  const eid=G.eventDeck.pop(); const d=ROUND_EVENTS.find(x=>x.id===eid); G.lastEvent=d.id;
  log(`Event: ${d.name}. ${d.text}`); resolveEvent(d);
  for(const p of G.players.filter(alive)) gainGold(p, INCOME+(NP()===1?SOLO_INCOME:0)+(G.flags.festival?1:0), 'round income');
}
function resolveEvent(d){
  const live=G.players.filter(alive);
  switch(d.id){
    case 'raiders': G.flags.raiders=1; break;
    case 'plague': G.flags.plague=1; break;
    case 'dragon': live.forEach(p=>{ if(p.loc==='forge'||p.loc==='mine') boardDamage(p,4,'the dragon'); }); break;
    case 'herald': G.herald+=5; break;
    case 'storm': G.flags.storm=1; break;
    case 'toll': live.forEach(p=>{ if(p.gold>=1){ p.gold--; log(`${p.name} pays the toll.`);} else boardDamage(p,3,'bandits'); }); break;
    case 'merchant': G.flags.merchant=1; break;
    case 'rally': live.forEach(p=>heal(p,4)); break;
    case 'goldRush': G.flags.goldRush=1; break;
    case 'festival': G.flags.festival=1; break;
    case 'caravan': live.forEach(p=>p.mats.iron++); break;
  }
}
function heal(p,n){ p.hp=Math.min(p.maxHp,p.hp+n); }
function gainGold(p,n,why){ if(n<=0) return; p.gold+=n; log(`${p.name} gains ${n} gold${why?' ('+why+')':''}.`); }
function gainMats(p,m){ const out=[]; for(const k in m){ if(!m[k]) continue; const n=Math.max(0,m[k]); p.mats[k]+=n; out.push(`${n} ${MATS[k].name}`);} if(out.length) log(`${p.name} gains ${out.join(', ')}.`); }
function boardDamage(p,n,why){ p.hp-=n; log(`${p.name} takes ${n} damage from ${why}.`); if(p.hp<=0) heroFalls(p); }
function endGame(won,msg){ if(G.over) return; G.over={won,msg,round:G.round}; G.combat=null; G.modals=[]; log(msg); }
function checkAllDead(){ if(!G.over && G.players.every(p=>p.dead)) endGame(false,'Every hero has fallen for good. Malgrath rules Thornhold.'); }
function heroFalls(p){
  if(suddenDeath()){ p.dead=true; p.hp=0; log(`☠ ${p.name} has fallen for good.`); checkAllDead(); return; }
  p.loc='cross'; p.hp=Math.min(10,p.maxHp); const lost=Math.ceil(p.gold/2); p.gold-=lost; p.kos++; p.lastUse=null;
  log(`${p.name} is knocked out! Respawns at the Crossroads with 10 HP and loses ${lost} gold.`);
}

function autoAdvance(){ if(G&&!G.over&&!G.combat&&!G.modals.length&&P().dead) endTurn(); }
function beginTurn(){ G.turn={roll:0, moved:false, acted:false, mud:false, flex:0}; log(`— ${P().name}'s turn —`); }
function endTurn(){
  if(G.over||G.combat||G.modals.length) return;
  for(let k=0;k<=NP();k++){ G.cur++; if(G.cur>=NP()){ G.cur=0; beginRound(); if(G.over) return; } if(alive(P())) break; }
  checkAllDead(); if(G.over) return; beginTurn();
}

// ===== Movement (one way) =====
function moveSteps(){ return Math.max(1,(G.turn.roll||0)-(G.flags.storm?1:0)); }
function walkFrom(start,n){ // destinations at exactly n steps forward, plus locations passed on the way (stop early)
  const res={}; const walk=(u,d,path)=>{ if(d===n){ if(!res[u]) res[u]=path.slice(); return; }
    if(d>0 && LOCS[u].kind!=='space' && !res[u]) res[u]=path.slice();
    for(const v of (NEXT[u]||[])){ path.push(v); walk(v,d+1,path); path.pop(); } };
  walk(start,0,[]); return res;
}
function reachable(p){
  if(!G.turn.roll||G.turn.moved) return {dist:{},paths:{}};
  const base=moveSteps(), flex=p.fac==='elf'?1:0, dist={}, paths={};
  for(let n=base; n<=base+flex; n++){ const r=walkFrom(p.loc,n); for(const k in r) if(dist[k]===undefined){ dist[k]=r[k].length; paths[k]=r[k]; } }
  delete dist[p.loc]; return {dist,paths};
}
function rollMove(){ const p=P(); if(G.turn.roll||G.turn.moved) return; G.turn.roll=1+ri(6);
  log(`${p.name} rolls a ${G.turn.roll}: move ${moveSteps()}${p.fac==='elf'?' (or 1 more)':''} space(s) forward, or stop early on a location.`); }
function stayPut(){ const p=P(); if(G.turn.moved) return; G.turn.moved=true; G.turn.roll=G.turn.roll||0; log(`${p.name} stays at ${LOCS[p.loc].name||'the road'}.`); }
function moveTo(v){
  const p=P(); if(!G.turn.roll||G.turn.moved) return false;
  const {dist,paths}=reachable(p); if(dist[v]===undefined) return false;
  const path=paths[v]; p.loc=v; G.turn.moved=true; const L=LOCS[v];
  log(`${p.name} travels ${dist[v]} space(s) to ${L.kind==='space'?'a road space':L.name}.`);
  if(path.includes('cross')) gainGold(p,1,'passing the Crossroads');
  if(L.kind==='space') landOnSpace(p,v);
  return true;
}
function landOnSpace(p,id){
  const t=G.spaces[id]; if(!t||t==='plain') return;
  const good = t==='good' || (t==='event' && rnd()<0.5);
  const ev = good?pick(GOOD_EVENTS):pick(BAD_EVENTS);
  let result='';
  switch(ev.id){
    case 'purse': gainGold(p,3,'lost purse'); result='+3 gold'; break;
    case 'spring': { const h=Math.min(5,p.maxHp-p.hp); heal(p,5); result=`Healed ${h} HP`; break; }
    case 'gift': { const st=pick(['creature','spell','artifact']); const inst=p.supply[st].shift(); if(inst){ addOwned(p,inst); result=`You gain ${HC[inst.id].name} (${st} stack).`; } else result='Your Supply stack was empty.'; break; }
    case 'cache': { const m=pick(Object.keys(MATS)); p.mats[m]++; result=`+1 ${MATS[m].name}`; break; }
    case 'tailwind': gainGold(p,1,'tailwind'); heal(p,2); result='+1 gold, healed 2'; break;
    case 'ambush': boardDamage(p,3,'a roadside ambush'); result='-3 HP'; break;
    case 'pickpocket': { const l=Math.min(2,p.gold); p.gold-=l; result=`-${l} gold`; break; }
    case 'tornPack': { if(p.owned.length){ const i=ri(p.owned.length); const inst=p.owned.splice(i,1)[0]; returnToSupply(p,inst); result=`${HC[inst.id].name} went back into your Supply Deck.`; } else result='You had nothing to lose.'; break; }
    case 'thorns': boardDamage(p,2,'thorns'); result='-2 HP'; break;
    case 'mud': G.turn.mud=true; result='No location action or Call to Fight this turn.'; break;
  }
  log(`${good?'✨':'⚠️'} ${ev.name}: ${result}`);
  G.modals.push({type:'event', pi:p.idx, good, ev, result, space:t});
}

// ===== Location actions =====
function usedLastRound(p){ return p.lastUse && p.lastUse.loc===p.loc && p.lastUse.round===G.round-1; }
function markUse(p){ p.lastUse={loc:p.loc, round:G.round}; G.turn.acted=true; }
function mineGold(p){ return G.flags.raiders?0:4+(p.fac==='dwarf'?2:0)+(G.flags.goldRush?2:0); }
function abbeyCost(p){ return p.fac==='warlock'?1:2; }
function getActions(p){
  const A=[]; const blocked=G.turn.acted||G.turn.mud||!G.turn.moved, rep=usedLastRound(p);
  const add=(a,label,dis,v,why)=>A.push({a,label,dis:!!dis||blocked||rep,v,why:rep?'You used this location last round':why});
  switch(p.loc){
    case 'cross': add('campfire','Campfire: heal 4',p.hp>=p.maxHp,null,'Already at full HP'); break;
    case 'tavern': add('tavern','Visit the Tavern (mana cards and quests)'); break;
    case 'shrine': add('pray','Pray: start your next fight with +1 mana',p.blessed,null,'Already blessed'); break;
    case 'forest': if(p.fac==='druid') add('forage','Forage (Druid): heal 5 and gain 2 gold',false,'both'); else { add('forage','Forage: heal 5',false,'heal'); add('forage','Forage: gain 2 gold',false,'gold'); } break;
    case 'beastden': add('shop','Beast Den: creature shop',!p.supply.creature.length,'creature','Your Creature stack is empty'); break;
    case 'lodge': add('shop',"Hunter's Lodge: creature shop",!p.supply.creature.length,'creature','Your Creature stack is empty'); break;
    case 'tower': add('shop','Mage Tower: spell shop',!p.supply.spell.length,'spell','Your Spell stack is empty'); break;
    case 'forge': add('forge','Mountain Forge: artifacts and upgrades'); break;
    case 'abbey': add('abbey',`Pay ${abbeyCost(p)} gold: heal to full`,p.gold<abbeyCost(p)||p.hp>=p.maxHp,null,'Not needed or not enough gold'); break;
    case 'mine': add('mine',G.flags.raiders?'Mine (raiders hold it this round)':`Mine for ${mineGold(p)} gold`,G.flags.raiders); break;
    case 'ruins': add('ruins',`Forbidden cache: pay ${ruinsHp(p)} HP, take 1 of ${ruinsCount(p)} cards`,p.hp<=ruinsHp(p),null,'Not enough HP'); break;
  }
  return A;
}
function errandsHere(p){ return p.quests.map(id=>QUESTS.find(q=>q.id===id)).filter(q=>q.type==='visit'&&q.loc===p.loc); }
function ruinsHp(p){ return p.fac==='warlock'?1:3; }
function ruinsCount(p){ return p.fac==='warlock'?5:3; }
function doAction(a,v){
  const p=P(); const act=getActions(p).find(x=>x.a===a&&(v===undefined||v===null||x.v==v)); if(!act||act.dis) return false;
  switch(a){
    case 'campfire': markUse(p); heal(p,4); log(`${p.name} rests by the campfire and heals 4.`); break;
    case 'pray': markUse(p); p.blessed=1; log(`${p.name} prays at the Shrine: +1 mana at the start of the next fight.`); break;
    case 'forage': markUse(p); if(v==='heal'||v==='both'){ heal(p,5); log(`${p.name} forages and heals 5.`);} if(v==='gold'||v==='both') gainGold(p,2,'foraging'); break;
    case 'abbey': markUse(p); p.gold-=abbeyCost(p); p.hp=p.maxHp; log(`${p.name} is healed to full at the Abbey.`); break;
    case 'mine': { markUse(p); gainGold(p,mineGold(p),'mining'); const roll=1+ri(6); if(roll===1) boardDamage(p,3,'a cave-in (rolled 1)'); break; }
    case 'shop': markUse(p); openShop(p,v); break;
    case 'forge': markUse(p); openShop(p,'artifact',true); break;
    case 'tavern': markUse(p); openTavern(p); break;
    case 'ruins': markUse(p); p.hp-=ruinsHp(p); log(`${p.name} pays ${ruinsHp(p)} HP to open the forbidden cache.`); G.modals.push({type:'ruins',pi:p.idx,stack:null,cards:[]}); break;
  }
  return true;
}
function doErrand(qid){
  const p=P(); const q=errandsHere(p).find(x=>x.id===qid); if(!q) return false;
  p.quests=p.quests.filter(x=>x!==qid); G.questDeck.unshift(qid);
  log(`${p.name} completes "${q.name}".`); gainGold(p,q.reward.gold,'errand'); gainMats(p,q.reward.mats); return true;
}

// ===== Shops: reveal 5 from the matching stack, buy up to 3, the rest are exiled =====
function shopPrice(p,inst,stack){
  const c=HC[inst.id]; let g=c.gold+(G.flags.plague?1:0);
  if(stack==='creature'&&p.fac==='druid') g--; if(stack==='spell'&&p.fac==='elf') g--; if(stack==='artifact'&&p.fac==='dwarf') g--;
  return Math.max(1,g);
}
function revealInto(m,p){
  const n=SHOP_REVEAL+(G.flags.merchant?1:0);
  for(let i=0;i<n && p.supply[m.stack].length;i++) m.cards.push(p.supply[m.stack].shift());
  m.revealed=true; log(`${p.name} reveals ${m.cards.length} card(s) from their ${m.stack} stack.`);
}
function openShop(p,stack,forge){
  const m={type:'shop',pi:p.idx,stack,cards:[],bought:0,max:SHOP_BUY,forge:!!forge,tab:'shop',revealed:false};
  G.modals.push(m);
  if(!forge) revealInto(m,p); // the Forge reveals only if you ask, so a visit just for upgrades exiles nothing
}
function forgeReveal(){ const m=G.modals[0]; if(!m||m.type!=='shop'||!m.forge||m.revealed) return false; revealInto(m,G.players[m.pi]); return true; }
function shopBuy(i){
  const m=G.modals[0]; if(!m||m.type!=='shop') return false; const p=G.players[m.pi], inst=m.cards[i]; if(!inst) return false;
  if(m.bought>=m.max) return false; const g=shopPrice(p,inst,m.stack); if(p.gold<g) return false;
  p.gold-=g; m.cards.splice(i,1); addOwned(p,inst); m.bought++; p.bought++;
  log(`${p.name} buys ${HC[inst.id].name}${inst.up.length?' ('+inst.up.map(u=>UPGRADES[u].name).join(', ')+')':''} for ${g} gold.`); return true;
}
function closeShop(){
  const m=G.modals[0]; if(!m||(m.type!=='shop'&&m.type!=='ruins')) return; const p=G.players[m.pi];
  if(m.cards.length){ p.exiled+=m.cards.length; log(`${m.cards.length} unbought card(s) are exiled for good: ${m.cards.map(c=>HC[c.id].name).join(', ')}.`); }

function ruinsPickStack(stack){

  for(let i=0;i<ruinsCount(p)&&p.supply[stack].length;i++) m.cards.push(p.supply[stack].shift());

function ruinsTake(i){

// Forge upgrades
function upgradeCost(p,uid){ const c=Object.assign({},UPGRADES[uid].cost); if(p.fac==='dwarf'){ const k=Object.keys(c).sort((a,b)=>c[b]-c[a])[0]; if(c[k]>1) c[k]--; } return c; }
function canAfford(p,cost){ return Object.keys(cost).every(k=>p.mats[k]>=cost[k]); }
function upgradeTargetType(inst){ const c=HC[inst.id]; if(c.type==='creature') return 'creature'; if(c.type==='equipment') return 'equipment'; if(c.type==='artifact') return 'artifact'; return 'spell'; }
function upgradeOk(p,inst,uid){
  const U=UPGRADES[uid], c=HC[inst.id]; if(upgradeTargetType(inst)!==U.for) return 'Wrong card type';
  if(inst.up.length>=MAX_UPGRADES) return 'Already has '+MAX_UPGRADES+' upgrades';
  if(U.once && inst.up.includes(uid)) return 'Already has it';
  if(uid==='keen' && c.c && c.c.kw && c.c.kw.first) return 'Already has First Strike';
  if(uid==='quickened' && c.c && c.c.kw && c.c.kw.haste) return 'Already has Haste';
  if(uid==='ashBlessed' && c.cost<=0) return 'Already free';
  if(uid==='runed' && !(c.fx&&(c.fx.dmg||c.fx.heal||c.fx.block||c.fx.aoe))) return 'No number to improve';
  if(!canAfford(p,upgradeCost(p,uid))) return 'Not enough materials';
  return '';
}
function forgeUpgrade(u,uid){
  const m=G.modals[0]; if(!m||m.type!=='shop'||!m.forge) return false; const p=G.players[m.pi];
  const inst=p.owned.find(x=>x.u===u); if(!inst||upgradeOk(p,inst,uid)) return false;
  const cost=upgradeCost(p,uid); for(const k in cost) p.mats[k]-=cost[k]; inst.up.push(uid);
  log(`${p.name} upgrades ${HC[inst.id].name}: ${UPGRADES[uid].name}.`); return true;
}
function forgeMelt(u){
  const m=G.modals[0]; if(!m||m.type!=='shop'||!m.forge) return false; const p=G.players[m.pi];
  const i=p.owned.findIndex(x=>x.u===u&&x.id==='mithril'); if(i<0) return false;
  const inst=p.owned.splice(i,1)[0]; returnToSupply(p,inst); p.mats.iron++; log(`${p.name} melts a Mithril Ingot into 1 Iron.`); return true;
}

function tavernBuy(which){ // 'plain' or special index

function tavernQuest(i){ const m=G.modals[0]; if(!m||m.type!=='tavern'||m.took) return; const p=G.players[m.pi]; const q=m.quests[i]; if(!q||p.quests.length>=2) return;
  p.quests.push(q); m.quests.splice(i,1); m.took=true; log(`${p.name} takes the quest "${QUESTS.find(x=>x.id===q).name}".`); }
function closeTavern(){ const m=G.modals[0]; if(!m||m.type!=='tavern') return; G.tavern.push(...m.specials); G.questDeck.unshift(...m.quests); G.modals.shift(); }
function closeModal(){ const m=G.modals[0]; if(!m) return; if(m.type==='shop'||m.type==='ruins') closeShop(); else if(m.type==='tavern') closeTavern(); else G.modals.shift(); }

// ===== Call to Fight (from anywhere, no die roll) =====
function warlordUnlocked(){ return G.cleared.filter(x=>x).length>=WARLORD_UNLOCK; }
function callTargets(p){
  const T=[]; const i=G.cleared.indexOf(false);
  if(i>=0) T.push({key:'stop:'+i, label:`⚔️ Stop ${i+1}: ${COMMANDERS[STOPS[i]].name}`});
  for(const qid of p.quests){ const q=QUESTS.find(x=>x.id===qid); if(q.type==='fight') T.push({key:'quest:'+qid, label:`📜 Quest: ${q.name} (${COMMANDERS[q.boss].name})`}); }
  T.push({key:'boss', label:'👑 Malgrath the Iron Warlord', dis:!warlordUnlocked(), why:`Clear ${WARLORD_UNLOCK} stops to unlock`});
  return T;
}
function callLabel(key){ if(key==='boss') return COMMANDERS.warlord.name; const [k,v]=key.split(':'); if(k==='stop') return `Stop ${+v+1}: ${COMMANDERS[STOPS[+v]].name}`; return 'Quest: '+QUESTS.find(q=>q.id===v).name; }
function canCall(){ return G && !G.over && !G.combat && !G.modals.length && G.turn && !G.turn.acted && !G.turn.mud && alive(P()) && P().hp>0; }
function callFight(key){
  if(!canCall()) return false; const p=P(); const t=callTargets(p).find(x=>x.key===key); if(!t||t.dis) return false;
  const others=G.players.filter(q=>q!==p&&alive(q)&&q.hp>0);
  G.modals.push({type:'call',pi:p.idx,key,resp:{},stage:others.length?'ask':'final',pass:1,ask:others.map(q=>q.idx),accepted:[],declined:[]});
  log(`📯 ${p.name} calls to fight ${callLabel(key)}!`); return true;
}
function callRespond(pi,yes){
  const m=G.modals[0]; if(!m||m.type!=='call'||!m.ask.includes(pi)||m.resp[pi]!==undefined) return;
  m.resp[pi]=yes; const q=G.players[pi]; log(m.stage==='ask'?`${q.name} ${yes?'accepts':'declines'} the call.`:`${q.name} ${yes?'stays in':'backs out'}.`);
  if(m.ask.some(i=>m.resp[i]===undefined)) return;
  if(m.stage==='ask'){ m.accepted=m.ask.filter(i=>m.resp[i]); m.declined=m.ask.filter(i=>!m.resp[i]);
    if(m.declined.length&&m.accepted.length){ m.stage='recon'; m.pass++; m.ask=m.accepted.slice(); m.resp={}; log('Someone declined, so everyone who accepted gets a chance to back out.'); } else m.stage='final'; }
  else if(m.stage==='recon'){ const out=m.ask.filter(i=>!m.resp[i]); m.accepted=m.ask.filter(i=>m.resp[i]); m.declined=m.declined.concat(out);
    if(out.length&&m.accepted.length){ m.pass++; m.ask=m.accepted.slice(); m.resp={}; log('Someone backed out, so the rest get another chance.'); } else m.stage='final'; }
}
function callGo(fight){
  const m=G.modals[0]; if(!m||m.type!=='call'||m.stage!=='final') return; G.modals.shift();
  const caller=G.players[m.pi]; if(!fight){ log(`${caller.name} backs out of the fight.`); return; }
  const fighters=[caller].concat(m.accepted.map(i=>G.players[i])).filter(q=>alive(q)&&q.hp>0);
  G.turn.acted=true;
  const [k,v]=m.key.split(':');
  if(k==='stop') startCombat({kind:'stop',stop:+v,cid:STOPS[+v]},fighters);
  else if(k==='quest') startCombat({kind:'quest',qid:v,cid:QUESTS.find(q=>q.id===v).boss},fighters);
  else startCombat({kind:'boss',cid:'warlord'},fighters);
}
// ===== Thornhold v3 — combat engine =====
// Round = every fighting hero takes a turn (untap, upkeep, ATTACK with creatures, then play mana and cards), then the commander takes his turn
// (untap, upkeep, ATTACK, heroes block, then he plays mana and cards). Attacking taps; new creatures enter tapped; blockers hit back.
const HAND_MAX = 7;
const SCALE = {1:{mana:1,draw:1,hand:3,start:0}, 2:{mana:1,draw:1,hand:4,start:1}, 3:{mana:1,draw:2,hand:4,start:1}, 4:{mana:2,draw:2,hand:5,start:2}};
const C_ = () => G.combat;
const FP = F => G.players[F.pi];
const liveF = () => G.combat.fighters.filter(F=>!F.out);
const activeF = () => { const C=G.combat; if(!C||C.phase!=='hero') return null; return C.fighters[C.active]; };
const ups = (inst,u) => inst ? inst.up.filter(x=>x===u).length : 0;

function startCombat(spec, players){
  const N=NP(), d=DIFF(), def=COMMANDERS[spec.cid], sc=SCALE[Math.min(4,N)];
  const isQuest=spec.kind==='quest';
  let hp=Math.round((def.hp+def.perHero*(N-1))*d.hp*(PARTY_HP[N]||1)*(1+0.1*escalation())); if(!isQuest) hp+=G.herald;
  let townAtkBonus=0, townManaBonus=0;
  if(spec.kind==='town'&&spec.town&&typeof TOWN_LEVEL!=='undefined'){
    let ts=TOWN_LEVEL[Math.max(1,Math.min(5,+spec.town.level||1))];
    if(ts){
      const kind=spec.town.boss;
      if(kind&&ts[kind]) ts=Object.assign({},ts,ts[kind]);
      hp=hp+(ts.hp||0)+(ts.perHero||0)*(N-1);
      if(ts.atk!=null) townAtkBonus=ts.atk-(def.atk+(N-1)+d.atk);
      townManaBonus=ts.mana||0;
    }
  }
  const relics=isQuest?def.relics.slice():def.relics.slice(0,d.relics);
  const deck=[]; for(const id in def.deck) for(let i=0;i<def.deck[id];i++) deck.push(id); shuffle(deck);
  const B={cid:spec.cid, name:def.name, icon:def.icon, hp, maxHp:hp, shield:0, atk:Math.max(1,def.atk+(N-1)+d.atk+townAtkBonus), manaCap:def.mana+(N-1)*2,
    manaPlayed:d.mana+sc.start+townManaBonus, mana:0, deck, hand:[], used:[], field:[], arts:[], relics, flags:{}, dead:[], exiledN:0, curse:0, temp:0};
  const C={...spec, fighters:[], boss:B, round:1, phase:'hero', active:0, step:'main1', pending:null, log:[], uidc:0, smoke:false, sel:null};
  G.combat=C;
  if(relics.includes('dragonscale')) B.shield=3; if(relics.includes('ironWill')) B.shield=4; if(relics.includes('scaleLite')) B.shield=2;
  for(let i=0;i<sc.hand;i++) bossDraw();
  for(const p of players){
    const draw = G.drawOrder==='random' ? shuffle(p.owned.slice()) : ownedSorted(p);
    const F={pi:p.idx, hand:[], draw, used:[], field:[], arts:[], dead:[], bench:[], manaHand:p.mana.map(id=>id), manaIn:[], mana:0, block:0,
      target:null, ally:null, strikeUsed:false, flags:{}, out:false, retreated:false, startBonus:(p.blessed?1:0)+(N===1?SOLO_MANA:0), spells:0, atkSel:{}};
    p.owned=[]; C.fighters.push(F);
    if(hasRelic(p,'hawk')) summon(F,TOKENS.hawk,{token:true});
    if(hasRelic(p,'impFamiliar')) summon(F,TOKENS.impTok,{token:true});
    if(hasRelic(p,'golemCore')) summon(F,TOKENS.golem,{token:true});
  }
  log(`⚔️ Battle: ${players.map(p=>p.name).join(', ')} vs ${B.icon} ${B.name} (${hp} HP${B.shield?', Shield '+B.shield:''}, ATK ${B.atk}). Relics: ${relics.map(r=>ERELICS[r].name).join(', ')}.`);
  if(relics.includes('ambusherHorn')){ for(let i=0;i<2;i++) summonBoss(EC.cutthroat,{untapped:true,noHasteAttack:true}); log('Ambush! Two Bandit Cutthroats leap out, ready to attack.'); }
  startHeroTurn(0);
}

// ---------- creature helpers ----------
function mkCreature(side, owner, def, o){
  const c=def.c||def; const inst=o.inst||null;
  const cr={uid:'c'+(++G.combat.uidc), side, owner, inst, id:o.id||def.id||null, name:o.name||def.name, baseAtk:c.atk, baseHp:c.hp, counters:0, dmg:0,
    shield:(c.shield||0), armor:(c.armor||0), kw:Object.assign({},c.kw||{}), tapped:!o.untapped, frozen:false, temp:{atk:0,hp:0}, eq:[], token:!!o.token,
    def:c, tags:(def.tags||c.tags||[]).slice(), curse:0, atkBonus:0, mist:false, sfUsed:false, exileAfter:false};
  if(inst){ cr.shield+=ups(inst,'hardened'); cr.baseHp+=2*ups(inst,'thickHide'); if(ups(inst,'keen')) cr.kw.first=1; if(ups(inst,'quickened')) cr.kw.haste=1; }
  if(cr.kw.haste) cr.tapped=false;
  return cr;
}
function ownerF(cr){ return cr.side==='hero' ? G.combat.fighters.find(F=>F.pi===cr.owner) : null; }
function allHeroCreatures(){ return G.combat?G.combat.fighters.flatMap(F=>F.out?[]:F.field):[]; }
function has(cr,k){
  if(cr.kw[k]) return true;
  for(const e of cr.eq){ const q=HC[e.id].eq; if(q.kw&&q.kw[k]) return true; }
  if(k==='haste'&&cr.side==='boss'&&G.combat.boss.arts.includes('warDrums')) return true;
  return false;
}
function tryWard(cr, spellName){
  if(!cr || !has(cr,'ward') || cr.wardUsed) return false;
  cr.wardUsed = true;
  log(`🛡 Ward: ${cr.name} cancels ${spellName}.`);
  return true;
}
function isImmune(cr){ return !!(cr && cr.immune); }
function isShadowpaw(cr){ return !!(cr && !cr.awakened && (cr.id==='shadowpaw' || (cr.inst && cr.inst.id==='shadowpaw' && cr.id!=='ursanox'))); }
function canAwaken(cr){ return isShadowpaw(cr) && crAlive(cr) && !cr.awakened; }
function showAwakenBanner(text){
  const C=G.combat; if(!C) return;
  C.flash={text, uid:null, at:C.round};
}
function awakenToUrsanox(cr, reason){
  const C=G.combat; if(!C||!canAwaken(cr)) return false;
  const u=HC.ursanox, c=u.c;
  const old=cr.name;
  cr.awakened=true; cr.immune=true; cr.formId='ursanox'; cr.id='ursanox';
  cr.name=u.name; cr.baseAtk=c.atk; cr.baseHp=c.hp; cr.dmg=0;
  cr.kw=Object.assign({}, c.kw||{});
  cr.def=Object.assign({}, c);
  cr.tags=(u.tags||c.tags||[]).slice();
  C.flash={text:old+' awakens as '+u.name+'!', uid:cr.uid, at:C.round};
  log(`✨ Awaken: ${old} transforms into ${u.name}. ${reason||'That damage or effect'} is canceled.`);
  const enemies=cr.side==='hero'?C.boss.field.slice():allHeroCreatures();
  log(`${u.name} awakens and deals 3 damage to every enemy creature.`);
  enemies.forEach(e=>damageCreature(e,3,{src:u.name}));
  return true;
}
function tryProtect(cr, effectName){
  if(!cr) return false;
  if(isImmune(cr)){ log(`${cr.name} can't be affected by spells or abilities${effectName?' ('+effectName+')':''}.`); return true; }
  if(canAwaken(cr)) return awakenToUrsanox(cr, effectName||'That effect');
  return false;
}
function returnHeld(host){
  const C=G.combat; if(!C||!host||!host.holding||!host.holding.length) return;
  const held=host.holding.slice(); host.holding=[];
  for(const t of held){
    if(!t) continue;
    t.tempExiled=false;
    if(t.side==='boss'){ if(!C.boss.field.includes(t)) C.boss.field.push(t); }
    else { const F=ownerF(t); if(F && !F.out && !F.field.includes(t)) F.field.push(t); }
    log(`${t.name} returns from exile (${host.name} left this fight).`);
  }
}
function leavePlay(cr){ if(cr) returnHeld(cr); }
function exileHighestUntilLeave(F, host){
  const C=G.combat; if(!C||!host) return;
  const pool=(host.side==='hero'?C.boss.field:allHeroCreatures()).filter(c=>!isImmune(c));
  if(!pool.length){ log(`${host.name} finds no enemy creature to exile.`); return; }
  pool.sort((a,b)=> (effAtk(b)-effAtk(a)) || (crValue(b)-crValue(a)));
  const t=pool[0];
  if(t.side==='boss') C.boss.field.splice(C.boss.field.indexOf(t),1);
  else { const o=ownerF(t); if(o) o.field.splice(o.field.indexOf(t),1); }
  t.tempExiled=true;
  host.holding=host.holding||[];
  host.holding.push(t);
  log(`✖ ${t.name} is exiled until ${host.name} leaves this fight.`);
}
function effAtk(cr){
  const C=G.combat; let a=cr.baseAtk+cr.counters+cr.temp.atk+cr.atkBonus-cr.curse;
  if(cr.side==='hero'){
    const F=ownerF(cr), p=F?FP(F):null;
    for(const e of cr.eq){ const q=HC[e.id].eq; a+=(q.atk||0)+ups(e,'honed')+(p&&hasRelic(p,'anvil')?1:0); if(q.counterBonus&&cr.counters>0) a+=1; }
    if(cr.def.eqAtk) a+=cr.eq.length;
    if(F){ for(const o of F.field){ if(o===cr) continue; if(o.def.lord) a+=o.def.lord; if(o.def.flyLord&&has(cr,'fly')) a+=1; if(o.def.shieldLord&&cr.shield>0) a+=1; }
      for(const art of F.arts){ const A=HC[art.id].art; if(A&&A.lord) a+=A.lord+ups(art,'masterwork'); } }
  } else {
    const B=C.boss; if(B.relics.includes('crown')) a+=1;
    if(B.relics.includes('packHunt')&&B.field.length>=2) a+=1;
    if(cr.tags.includes('whelp')&&B.arts.includes('moltenHoard')) a+=1;
  }
  return Math.max(0,a);
}
function effHp(cr){
  let h=cr.baseHp+cr.counters+cr.temp.hp;
  if(cr.side==='hero'){ for(const e of cr.eq) h+=HC[e.id].eq.hp||0; const F=ownerF(cr); if(F) for(const o of F.field) if(o!==cr&&o.def.flyLord&&has(cr,'fly')) h+=1;
    if(G.combat.boss.relics.includes('witheringAura')) h-=1; }
  return Math.max(1,h);
}
const hpLeft = cr => effHp(cr)-cr.dmg;
const canBlock = (b,a) => !b.tapped && !has(b,'noblock') && (!has(a,'fly') || has(b,'fly') || has(b,'reach'));
const inMainStep = (step) => step==='main1'||step==='main2';
function actingPi(fromPi){
  if(fromPi!=null && fromPi!=='') return +fromPi;
  if(typeof UI!=='undefined' && UI.actorPi!=null) return +UI.actorPi;
  if(typeof TOWN!=='undefined' && TOWN.on) return TOWN.localPi;
  const F=typeof G!=='undefined'&&G.combat?activeF():null; return F?F.pi:null;
}
function ownsCreature(cr, fromPi){
  if(!cr) return false;
  if(typeof TOWN==='undefined'||!TOWN.on) return true;
  const pi=actingPi(fromPi); return pi==null || cr.owner===pi;
}
function requireActiveHero(fromPi){
  const C=G&&G.combat; if(!C||C.phase!=='hero') return false;
  const F=activeF(); if(!F) return false;
  if(typeof TOWN!=='undefined'&&TOWN.on){ const pi=actingPi(fromPi); if(pi!=null && pi!==F.pi) return false; }
  return true;
}

function crValue(cr){ return effAtk(cr)*2+hpLeft(cr)+cr.shield+(cr.token?-2:0)+(cr.inst?HC[cr.inst.id].cost:0); }

function summon(F, def, o){
  o=o||{}; const p=FP(F);
  const cr=mkCreature('hero',F.pi,def,o); if(hasRelic(p,'helm')) cr.shield+=1;
  F.field.push(cr);
  const c=def.c||def;
  log(`${p.name} ${o.token?'creates':'summons'} ${cr.name} (${effAtk(cr)}/${effHp(cr)}${cr.shield?', Shield '+cr.shield:''})${cr.tapped?', tapped':''}.`);
  if(o.token) for(const art of F.arts) if(HC[art.id].art&&HC[art.id].art.tokenCounter) cr.counters+=1;
  const e=c.etb; if(e && !o.noEtb){
    if(e.counters==='others') F.field.forEach(x=>{ if(x!==cr) x.counters++; });
    if(e.tokens) for(let i=0;i<e.tokens[0];i++) summon(F,TOKENS[e.tokens[1]],{token:true});
    if(e.draw) drawCards(F,e.draw);
    if(e.dmg) damageTarget(F,getTarget(F),e.dmg,{});
    if(e.exileHighest) exileHighestUntilLeave(F, cr);
    if(e.selfDmg) loseHp(F,e.selfDmg,cr.name);
    if(e.freeEquip) F.flags.freeEquip=1;
    if(e.scry) scry(F,e.scry);
  }
  if(cr.kw.haste && !o.noHasteAttack && !G.combat.over){ heroAttack(F,[cr],true); }
  return cr;
}
function summonBoss(def,o){
  o=o||{}; const C=G.combat, B=C.boss; const cr=mkCreature('boss',null,def,Object.assign({},o,{untapped:o.untapped})); B.field.push(cr);
  if(has(cr,'haste')) cr.tapped=false;
  log(`${B.name} ${o.token?'creates':'summons'} ${cr.name} (${effAtk(cr)}/${effHp(cr)})${cr.tapped?', tapped':''}.`);
  const c=def.c||def; if(c.etb&&c.etb.hit) bossHit(c.etb.hit,'any',cr.name);
  return cr;
}
function scry(F,n){ const top=F.draw.slice(0,n); if(top.length<2) return; const cheap=top.reduce((a,b)=>HC[a.id].cost<=HC[b.id].cost?a:b); F.draw.splice(F.draw.indexOf(cheap),1); F.draw.push(cheap); }

// ---------- damage ----------
function damageCreature(cr,n,o){
  o=o||{}; if(n<=0||!crAlive(cr)) return 0;
  if(isImmune(cr)){ log(`${cr.name} takes no damage.`); return 0; }
  if(!o.pierce){ n-=cr.armor; for(const e of cr.eq) n-=HC[e.id].eq.armor||0; if(n<=0) return 0;
    if(cr.shield>0){ n-=cr.shield; cr.shield--; if(n<=0){ return 0; } } }
  if(canAwaken(cr) && (o.dt || cr.dmg+n>=effHp(cr))){ awakenToUrsanox(cr, 'That damage'); return 0; }
  cr.dmg+=n;
  if(o.dt || cr.dmg>=effHp(cr)) killCreature(cr,o.src);
  return n;
}
function crAlive(cr){ const C=G.combat; return cr.side==='boss' ? C.boss.field.includes(cr) : C.fighters.some(F=>F.field.includes(cr)); }
function damageBoss(n,o){
  o=o||{}; const C=G.combat, B=C.boss; if(n<=0||C.over) return 0;
  if(!o.pierce && B.shield>0){ n-=B.shield; B.shield--; if(n<=0) return 0; }
  B.hp-=n; if(o.src) log(`${o.src} hits ${B.name} for ${n}.`);
  if(B.relics.includes('searingBreath')&&!B.flags.breath&&B.hp>0&&B.hp<B.maxHp/2){ B.flags.breath=1; log(`🔥 Searing Breath! ${B.name} scorches every hero creature for 3.`); allHeroCreatures().forEach(c=>damageCreature(c,3,{})); }
  checkBossDead(); return n;
}
function checkBossDead(){
  const C=G.combat, B=C.boss; if(C.over||B.hp>0) return;
  if(B.relics.includes('phylactery')&&!B.flags.phyl&&B.exiledN<2){ B.flags.phyl=1; B.hp=10; log(`💀 The Phylactery glows: ${B.name} rises again with 10 HP! (Exile 2 of his creatures to crack it.)`); return; }
  endCombat(true);
}
function damageHero(F,n,src){
  if(n<=0||F.out) return 0; const p=FP(F); const b=Math.min(F.block,n); F.block-=b; n-=b;
  if(n>0){ p.hp-=n; log(`${src||'An attack'} hits ${p.name} for ${n}${b?` (${b} blocked)`:''}.`); if(p.hp<=0) heroDown(F); }
  else if(b) log(`${p.name} blocks ${b} from ${src||'an attack'}.`);
  return n;
}
function loseHp(F,n,why){ const p=FP(F); p.hp-=n; if(p.hp<=0) heroDown(F); }
function healHero(F,n){ const p=FP(F); p.hp=Math.min(p.maxHp,p.hp+n); }
function heroDown(F){
  const p=FP(F), C=G.combat; if(F.out||C.over) return;
  if(hasRelic(p,'shadowVeil')&&!F.flags.veil){ F.flags.veil=1; p.hp=1; log(`🌑 Shadow Veil: ${p.name} clings on at 1 HP.`); return; }
  const ph=F.arts.findIndex(a=>a.id==='phylactery');
  if(ph>=0&&F.field.length&&!F.flags.phyl){ F.flags.phyl=1; const v=F.field.slice().sort((a,b)=>crValue(a)-crValue(b))[0]; log(`Soulstone Phylactery: ${p.name} sacrifices ${v.name} and returns to 5 HP.`); killCreature(v,null); p.hp=5; return; }
  F.out=true; p.hp=0; F.field.slice().forEach(leavePlay); F.bench=F.field; F.field=[]; log(`💀 ${p.name} falls in battle!`);
  if(liveF().length===0) endCombat(false);
}
function getTarget(F){
  const B=G.combat.boss; const taunts=B.field.filter(c=>has(c,'taunt')&&!c.tapped);
  let t=F.target; if(t&&t!=='boss'&&!B.field.some(c=>c.uid===t)) t=null;
  if(taunts.length){ if(!t||t==='boss'||!taunts.some(c=>c.uid===t)) t=taunts[0].uid; }
  if(!t) t='boss'; return t;
}
function damageTarget(F,t,n,o){
  const B=G.combat.boss; if(t==='boss') return damageBoss(n,Object.assign({},o,{src:o.srcName}));
  const cr=B.field.find(c=>c.uid===t); if(!cr) return damageBoss(n,o); return damageCreature(cr,n,o);
}
function getAlly(F,pref){
  let cr=F.field.find(c=>c.uid===F.ally); if(cr) return cr; if(!F.field.length) return null;
  const s=F.field.slice(); if(pref==='weak') s.sort((a,b)=>crValue(a)-crValue(b)); else if(pref==='sturdy') s.sort((a,b)=>(hpLeft(b)+b.shield)-(hpLeft(a)+a.shield)); else s.sort((a,b)=>effAtk(b)-effAtk(a)||hpLeft(b)-hpLeft(a));
  return s[0];
}

function killCreature(cr,src){
  const C=G.combat; if(!crAlive(cr)) return;
  if(tryProtect(cr, 'A spell or ability')) return;
  if(cr.side==='hero'){
    const F=ownerF(cr), p=FP(F); F.field.splice(F.field.indexOf(cr),1); log(`☠ ${cr.name} (${p.name}) dies.`);
    leavePlay(cr);
    for(const e of cr.eq) F.used.push(e); cr.eq=[];
    let back=false;
    if(cr.inst && hasRelic(p,'verdantHeart') && !F.flags.verdant){ F.flags.verdant=1; back=true; const n=summon(F,HC[cr.inst.id],{inst:cr.inst,noEtb:true,noHasteAttack:true}); n.tapped=true; n.counters=1; log('Verdant Heart returns it to play.'); }
    else if(cr.inst && ups(cr.inst,'soulforged') && !cr.inst.sf){ cr.inst.sf=1; back=true; F.hand.push(cr.inst); log(`Soulforged: ${cr.name} returns to ${p.name}'s hand.`); }
    else if(cr.inst){ F.dead.push(cr.inst); }
    const d=cr.def.death; if(d){ if(d.healAll) liveF().forEach(f=>healHero(f,d.healAll)); if(d.heal) healHero(F,d.heal);
      if(d.token) summon(F,TOKENS[d.token],{token:true}); if(d.dmgBoss) damageBoss(d.dmgBoss,{src:cr.name}); if(d.shieldAlly){ const a=getAlly(F,'sturdy'); if(a){ a.shield++; } } }
    for(const art of F.arts){ const A=HC[art.id].art; if(A&&A.altar&&(F.flags.altar||0)<A.altar+ups(art,'masterwork')){ F.flags.altar=(F.flags.altar||0)+1; F.mana++; log('Bone Altar: +1 mana.'); } }
  } else {
    const B=C.boss; B.field.splice(B.field.indexOf(cr),1); log(`☠ ${B.name}'s ${cr.name} dies.`);
    leavePlay(cr);
    if(!cr.token) B.dead.push(cr.id);
    const d=cr.def.death; if(d){ if(d.hurtHeroes) liveF().forEach(f=>loseHp(f,d.hurtHeroes,cr.name)); if(d.hit) bossHit(d.hit,'creature',cr.name); }
    if(B.relics.includes('graveTide')&&rnd()<0.5&&!C.over){ summonBoss(TOKENS.zombie,{token:true,name:'Risen Zombie'}); B.field[B.field.length-1].baseAtk=1; B.field[B.field.length-1].baseHp=1; }
  }
  if(C.over) return;
  for(const o of [...allHeroCreatures(),...C.boss.field]) if(o.def.harvest&&o!==cr) o.counters++;
  for(const F of liveF()) for(const o of F.field) if(o.def.vex&&o!==cr){ healHero(F,1); damageBoss(1,{pierce:true}); }
}
function exileCreature(cr){
  const C=G.combat; if(!crAlive(cr)) return;
  if(tryProtect(cr, 'Exile')) return;
  if(cr.side==='boss'){ C.boss.field.splice(C.boss.field.indexOf(cr),1); leavePlay(cr); C.boss.exiledN++; log(`✖ ${cr.name} is exiled.`); }
  else { const F=ownerF(cr); F.field.splice(F.field.indexOf(cr),1); leavePlay(cr); for(const e of cr.eq) F.used.push(e); if(cr.inst){ FP(F).exiled++; } log(`✖ ${cr.name} is exiled.`); }
}

// ---------- hero turn ----------
function manaProduce(F){ let m=0; for(const x of F.manaIn){ if(x.sick) continue; const M=MANA[x.id]; m+= M.mana||(M.primal&&F.field.length>=3?2:1); } return m; }
function startHeroTurn(i){
  const C=G.combat; if(C.over) return;
  while(i<C.fighters.length && C.fighters[i].out) i++;
  if(i>=C.fighters.length){ bossTurn(); return; }
  C.phase='hero'; C.active=i; const F=C.fighters[i], p=FP(F);
  F.field.forEach(c=>{ c.tapped=false; }); F.block=0; F.strikeUsed=false; F.spells=0; F.flags.pact=false; F.flags.altar=0; F.flags.swift=false; F.flags.sylvan=false; F.flags.quiver=false; F.flags.junk=false; F.manaThisTurn=false; F.atkSel={};
  F.manaIn.forEach(x=>x.sick=false);
  F.mana=manaProduce(F)+F.startBonus;
  log(`— ${p.name}'s turn (round ${C.round}) · ${F.mana} mana —`);
  // upkeep
  for(const cr of F.field.slice()){
    if(cr.kw.overgrow){ cr.kw.overgrow=0; cr.baseAtk=Math.max(cr.baseAtk,2); cr.baseHp=Math.max(cr.baseHp,2); }
    const u=cr.def.upkeep; if(u){ if(u.counterSelf) cr.counters+=u.counterSelf; if(u.countersOthers) F.field.forEach(x=>{ if(x!==cr) x.counters++; }); if(u.block) F.block+=u.block; if(u.selfDmg) loseHp(F,u.selfDmg,cr.name); if(u.token) summon(F,TOKENS[u.token],{token:true}); }
    for(const e of cr.eq){ const q=HC[e.id].eq; if(q.refill) cr.shield=Math.max(cr.shield,q.refill); if(q.upkeepSelfDmg) loseHp(F,q.upkeepSelfDmg,'Cursed Dagger'); }
    if(C.over) return; if(F.out){ startHeroTurn(i+1); return; }
  }
  for(const art of F.arts){ const A=HC[art.id].art; if(!A) continue; const mw=ups(art,'masterwork');
    if(A.bulwark) F.block+=A.bulwark+mw;
    if(A.ballista){ const t=C.boss.field.filter(c=>c.tapped).sort((a,b)=>crValue(b)-crValue(a))[0]; if(t) damageCreature(t,A.ballista+mw,{}); else damageBoss(A.ballista+mw,{src:'Steam Ballista'}); }
    if(C.over) return; }
  if(hasRelic(p,'wolfTotem')&&C.round%2===0&&F.field.filter(c=>c.name==='Wolf Pup').length<2) summon(F,TOKENS.wolfPup,{token:true});
  if(hasRelic(p,'circleThorns')) F.field.forEach(c=>{ if(c.counters>0&&c.shield===0) c.shield=1; });
  refillHand(F);
  C.step='main1';
}
function handBought(F){ return F.hand.length; }
function drawOne(F){
  if(F.hand.length>=HAND_MAX) return false;
  if(F.draw.length){ F.hand.push(F.draw.shift()); return true; }
  if(!F.flags.junk){ F.flags.junk=true; F.hand.push({u:nextUid(), id:rnd()<0.5?'rustyDagger':'stumble', up:[], junk:1}); log(`${FP(F).name}'s deck is dry: they draw a junk card.`); return true; }
  return false;
}
function drawCards(F,n){ for(let i=0;i<n;i++) if(!drawOne(F)) break; }
function refillHand(F){ while(F.hand.length<HAND_BOUGHT){ if(!drawOne(F)) break; } }
function clearHeroTemps(F){ F.field.forEach(c=>{ c.temp={atk:0,hp:0}; c.mist=false; }); F.field.slice().forEach(c=>{ if(c.dmg>=effHp(c)) killCreature(c,null); }); }

function toggleAttacker(uid){ if(!requireActiveHero()) return; const F=activeF(); if(!F||G.combat.step!=='attack') return; const c=F.field.find(x=>x.uid===uid); if(!c||c.tapped||!ownsCreature(c)) return; F.atkSel[uid]=!F.atkSel[uid]; }
function declareAttack(uids){
  const C=G.combat, F=activeF(); if(!requireActiveHero()||!F||C.step!=='attack') return false;
  const list=(uids||Object.keys(F.atkSel).filter(k=>F.atkSel[k])).map(u=>F.field.find(c=>c.uid===u)).filter(c=>c&&!c.tapped&&effAtk(c)>0);
  if(list.length) heroAttack(F,list,false); else log(`${FP(F).name} holds their creatures back.`);
  if(C.over) return true;
  clearHeroTemps(F); C.step='main2'; return true;
}
function heroAttack(F,list,haste){
  const C=G.combat, B=C.boss, p=FP(F);
  const items=list.map(a=>({a, blk:null, cancel:false, bonus:0}));
  for(const it of items){ if(!has(it.a,'vig')&&!it.a.mist) it.a.tapped=true; }
  const rallies=items.filter(it=>has(it.a,'rally')).length; items.forEach(it=>{ it.bonus=rallies-(has(it.a,'rally')?1:0); });
  log(`${p.name} attacks with ${items.map(it=>it.a.name+' ('+(effAtk(it.a)+it.bonus)+')').join(', ')}${haste?' (Haste)':''}.`);
  for(const it of items){ const a=it.a;
    if(a.def.onAttack&&a.def.onAttack.untapOther){ const o=items.filter(x=>x.a!==a&&x.a.tapped).sort((x,y)=>effAtk(y.a)-effAtk(x.a))[0]; if(o){ o.a.tapped=false; log(`Windcaller untaps ${o.a.name}.`);} }
    for(const e of a.eq) if(HC[e.id].eq.pingBoss) damageBoss(1,{src:'Elvish Longbow'});
    if(B.arts.includes('caltrops')) damageCreature(a,1,{});
    if(C.over) return; }
  // commander blocks
  bossBlocks(items);
  // smoke bomb
  const sb=B.hand.indexOf('smokeBomb'); const big=items.filter(it=>!it.blk&&crAlive(it.a)).sort((x,y)=>effAtk(y.a)-effAtk(x.a))[0];
  if(sb>=0&&B.mana>=2&&big&&effAtk(big.a)>=3&&DIFF().ai!=='easy'){ B.mana-=2; B.hand.splice(sb,1); B.used.push('smokeBomb'); if(!luckyCancel()){ big.cancel=true; log(`${B.name} throws a Smoke Bomb: ${big.a.name}'s attack is canceled.`);} }
  resolveAttacks(items,'boss');
  if(C.over) return;
  if(hasRelic(p,'swiftwind')&&!F.flags.swift){ const t=items.map(it=>it.a).filter(c=>crAlive(c)&&c.tapped).sort((x,y)=>effAtk(y)-effAtk(x))[0]; if(t){ F.flags.swift=1; t.tapped=false; log(`Swiftwind Boots untap ${t.name}.`);} }
}
function bossBlocks(items){
  const B=G.combat.boss, ai=DIFF().ai; const avail=B.field.filter(c=>!c.tapped&&!has(c,'noblock'));
  const sorted=items.slice().sort((x,y)=>effAtk(y.a)-effAtk(x.a)); let incoming=sum(items.map(it=>effAtk(it.a)+it.bonus));
  for(const it of sorted){ const a=it.a; if(a.mist||!crAlive(a)) continue;
    const cand=avail.filter(b=>canBlock(b,a)); if(!cand.length) continue; let pick=null; const atk=effAtk(a)+it.bonus;
    const taunt=cand.filter(b=>has(b,'taunt'));
    const kills=b=>effAtk(b)>=hpLeft(a)+a.shield||has(b,'dt'); const survives=b=>atk<hpLeft(b)+b.shield+b.armor&&!has(a,'dt')||(has(b,'first')&&kills(b)&&!has(a,'first'));
    if(taunt.length) pick=taunt.sort((x,y)=>(survives(y)-survives(x))||(hpLeft(y)-hpLeft(x)))[0];
    else if(ai==='easy'){ if(rnd()<0.35) pick=pick||cand[ri(cand.length)]; }
    else { pick=cand.find(b=>kills(b)&&survives(b))||cand.find(b=>survives(b))||cand.find(b=>kills(b)&&crValue(b)<=crValue(a)+2);
      if(!pick&&(incoming>=B.hp*(ai==='smart'?0.6:0.9))) pick=cand.sort((x,y)=>crValue(x)-crValue(y))[0]; }
    if(pick){ it.blk=pick; avail.splice(avail.indexOf(pick),1); incoming-=atk; }
  }
}
function luckyCancel(){ // a hero's Lucky Charm cancels the commander's spell
  for(const F of liveF()){ const i=F.arts.findIndex(a=>a.id==='luckyCharm'); if(i>=0){ const inst=F.arts.splice(i,1)[0]; F.used.push(inst); log(`🍀 ${FP(F).name}'s Lucky Charm cancels the spell!`); return true; } }
  return false;
}

// generic attack resolution. side = who is being attacked ('boss' or 'heroes')
function atkOf(it){ return it.a.cmd ? Math.max(0,G.combat.boss.atk-G.combat.boss.curse+G.combat.boss.temp) : effAtk(it.a)+(it.bonus||0); }
function resolveAttacks(items,side){
  const C=G.combat;
  for(const it of items){
    if(C.over) return; const a=it.a; if(!a.cmd&&!crAlive(a)) continue;
    if(it.cancel){ continue; }
    const blk=it.blk && crAlive(it.blk) ? it.blk : null;
    if(blk) fightPair(it,blk,side); else hitDefender(it,atkOf(it),side);
  }
  C.smoke=false;
}
function srcName(it){ return it.a.cmd ? G.combat.boss.name : it.a.name; }
function strike(it,from,to,n,side){ // from deals n to creature 'to'; returns actual
  const dt=!from.cmd&&has(from,'dt'), pierce=!from.cmd&&has(from,'pierce');
  const before=hpLeft(to); const dealt=damageCreature(to,n,{dt,pierce,src:from.name});
  if(!from.cmd&&has(from,'life')&&dealt>0) lifelink(from,dealt);
  return {dealt,before};
}
function lifelink(cr,n){ if(cr.side==='hero'){ const F=ownerF(cr); if(F) healHero(F,n); } else { const B=G.combat.boss; B.hp=Math.min(B.maxHp,B.hp+n); } }
function fightPair(it,b,side){
  const a=it.a, C=G.combat; const n=atkOf(it);
  if(has(b,'fortify')) b.shield++;
  log(`${b.name} blocks ${srcName(it)}.`);
  const aF=!a.cmd&&(has(a,'first')||has(a,'twice')), bF=has(b,'first')||has(b,'twice');
  const aN=a.cmd||!has(a,'first')||has(a,'twice'), bN=!has(b,'first')||has(b,'twice');
  const hitBack=(m)=>{ if(m<=0) return; if(a.cmd){ damageBoss(m,{src:b.name,pierce:has(b,'pierce')}); if(has(b,'life')) lifelink(b,m); } else if(crAlive(a)) strike(it,b,a,m,side); };
  let trampled=0;
  const hitBlk=()=>{ if(!crAlive(b)){ if(!a.cmd&&has(a,'trample')) trampled+=n; return; } const r=strike(it,a,b,n,side); if(!a.cmd&&has(a,'trample')&&!crAlive(b)) trampled+=Math.max(0,n-r.before); };
  if(aF||bF){ if(aF) hitBlk(); if(bF&&crAlive(b)&&(a.cmd||crAlive(a))) hitBack(effAtk(b)); }
  if(C.over) return;
  if(aN&&(a.cmd||crAlive(a))) hitBlk();
  if(bN&&crAlive(b)&&(a.cmd||crAlive(a))) hitBack(effAtk(b));
  if(b.def.onBlock&&crAlive(b)){ if(b.def.onBlock.counterSelf) b.counters++; }
  if(b.def.onBlock&&b.def.onBlock.pingAttackers&&!a.cmd&&crAlive(a)) damageCreature(a,1,{});
  if(trampled>0&&!C.over) hitDefender(it,trampled,side);
}
function hitDefender(it,n,side){
  const C=G.combat, a=it.a; if(n<=0) return;
  if(side==='boss'){ const d=damageBoss(n,{pierce:has(a,'pierce'),src:a.name}); if(has(a,'life')&&d>0) lifelink(a,d); }
  else { const F=it.tgt; if(!F||F.out) return; if(C.smoke){ log(`Smoke Screen: ${srcName(it)} can't find ${FP(F).name}.`); return; }
    const d=damageHero(F,n,srcName(it)); if(!a.cmd&&has(a,'life')&&d>0) lifelink(a,d);
    if(d>0&&!a.cmd&&C.boss.relics.includes('stolenPurse')){ const p=FP(F); if(p.gold>0){ p.gold--; log(`Stolen Purse: ${p.name} loses 1 gold.`);} } }
}

// ---------- playing hero cards ----------
function cardCost(F,inst){
  const c=HC[inst.id], p=FP(F); let k=c.cost-ups(inst,'ashBlessed');
  if(c.type==='equipment'){ if(F.flags.freeEquip||F.field.some(x=>x.def.brokk)) return 0; k-=ups(inst,'bonded')+(hasRelic(p,'anvil')?1:0)+(F.flags.eqDiscount||0); }
  if(c.type==='instant'&&!F.flags.sylvan&&F.manaIn.some(x=>MANA[x.id].sylvan&&!x.sick)) k-=1;
  return Math.max(0,k);
}
function whyNot(F,inst,inBlock){
  const c=HC[inst.id]; const C=G.combat;
  if(cardCost(F,inst)>F.mana) return 'Not enough mana';
  if(inBlock && c.type!=='instant') return 'Only instants now';
  const fx=c.fx||{};
  if((c.type==='equipment'||fx.pump||fx.mistwalk||fx.offering||fx.hammer||fx.untapOne||(c.art&&c.art.shieldNow)) && !F.field.length) return 'Needs a creature';
  if(fx.raise && !F.dead.length) return 'No creature of yours has died';
  if(fx.destroy){ const t=pickDestroy(F,fx.destroy); if(!t) return 'No valid enemy creature'; }
  if(fx.cancelAttack && !inBlock) return 'Use it when the commander attacks';
  if(fx.smoke && !inBlock) return 'Use it when the commander attacks';
  if(fx.recall && !F.used.some(u=>u.id!=='recall'&&!HC[u.id].junk)) return 'Nothing to recall';
  return '';
}
function pickDestroy(F,d){
  const B=G.combat.boss; const t=getTarget(F); let cr=B.field.find(c=>c.uid===t);
  const ok=c=>!d.maxAtk||effAtk(c)<=d.maxAtk;
  if(cr&&ok(cr)) return cr; return B.field.filter(ok).sort((a,b)=>crValue(b)-crValue(a))[0]||null;
}
function playCard(i,fi){
  const C=G.combat; if(!C||C.over) return false;
  const inBlock=C.phase==='block'; let F;
  if(inBlock){ F=C.fighters[fi===undefined?0:fi]; if(!F||F.out) return false; if(typeof TOWN!=='undefined'&&TOWN.on){ const pi=actingPi(); if(pi!=null && pi!==F.pi) return false; } } else { F=activeF(); if(!requireActiveHero()||!F||!inMainStep(C.step)) return false; }
  const inst=F.hand[i]; if(!inst) return false; const c=HC[inst.id];
  if(whyNot(F,inst,inBlock)) return false;
  if(inBlock&&C.pending){ const it=C.pending.items[C.sel||0]; if(it&&it.blk&&F.field.includes(it.blk)) F.ally=it.blk.uid; }
  const cost=cardCost(F,inst); F.mana-=cost; F.hand.splice(i,1); const p=FP(F);
  if(c.type==='instant'&&F.manaIn.some(x=>MANA[x.id].sylvan&&!x.sick)) F.flags.sylvan=true;
  if(c.type==='equipment'&&F.flags.freeEquip) F.flags.freeEquip=0;

  const B=C.boss;

    else if(A.shieldNow){ const cr=getAlly(F,'sturdy'); cr.shield+=A.shieldNow+mw; log(`${cr.name} gains Shield ${A.shieldNow+mw}.`); F.used.push(inst); }
    else F.arts.push(inst); }
  else { F.spells++; resolveFx(F,inst,c.fx||{},inBlock); F.used.push(inst);
    if(F.spells===2) F.field.forEach(x=>{ if(x.def.sage){ drawCards(F,1); log('Starweaver Sage: draw a card.'); } }); }

}
function playStrike(){ const C=G.combat, F=activeF(); if(!requireActiveHero()||!F||!inMainStep(C.step)||F.strikeUsed) return false; F.strikeUsed=true; F.block+=1; log(`${FP(F).name} uses Basic Strike.`); damageTarget(F,getTarget(F),2,{}); return true; }
function playMana(i){ const C=G.combat, F=activeF(); if(!requireActiveHero()||!F||!inMainStep(C.step)||F.manaThisTurn) return false; const id=F.manaHand[i]; if(!id) return false; const M=MANA[id], p=FP(F);
  F.manaHand.splice(i,1); F.manaThisTurn=true; F.manaIn.push({id,sick:!!M.sick});
  if(!M.sick) F.mana+= M.mana||(M.primal&&F.field.length>=3?2:1);
  const o=M.onPlay||{}; if(o.heal) healHero(F,o.heal); if(o.draw) drawCards(F,o.draw); if(o.eqDiscount) F.flags.eqDiscount=(F.flags.eqDiscount||0)+1; if(o.shieldAlly){ const a=getAlly(F,'sturdy'); if(a) a.shield++; }
  if(o.recall){ recallBest(F); }

function recallBest(F){ const s=F.used.filter(u=>u.id!=='recall'&&!HC[u.id].junk).sort((a,b)=>HC[b.id].cost-HC[a.id].cost)[0];
