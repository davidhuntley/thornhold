function bloodPact(){ const F=activeF(); if(!requireActiveHero()||!F||!inMainStep(G.combat.step)) return false; const p=FP(F); if(!hasRelic(p,'bloodPact')||F.flags.pact||p.hp<=2) return false; F.flags.pact=1; loseHp(F,2,'Blood Pact'); F.mana++; log(`${p.name} pays 2 HP for 1 mana (Blood Pact).`); return true; }
function sacThrall(uid){ const F=activeF(); if(!requireActiveHero()||!F||!inMainStep(G.combat.step)) return false; const cr=F.field.find(c=>c.uid===uid&&c.def.sacMana); if(!cr||!ownsCreature(cr)) return false; log(`${FP(F).name} sacrifices ${cr.name} for 1 mana.`); F.mana+=1; killCreature(cr,null); return true; }
function setTarget(t){ const C=G.combat; if(!C) return; const F=C.phase==='hero'?activeF():C.fighters[C.blockFi||0]; if(F) F.target=t; }
function setAlly(uid){ const C=G.combat; if(!C) return; const F=C.phase==='hero'?activeF():null; if(!F||!requireActiveHero()) return; const cr=F.field.find(c=>c.uid===uid); if(uid && cr && !ownsCreature(cr)) return; F.ally=(F.ally===uid?null:uid); }

function resolveFx(F,inst,fx,inBlock){
  const C=G.combat, B=C.boss, p=FP(F), R=ups(inst,'runed');
  const qb=()=>{ if(hasRelic(p,'quiver')&&!F.flags.quiver){ F.flags.quiver=true; return 1; } return 0; };
  const t=getTarget(F);
  if(fx.dmg) damageTarget(F,t,fx.dmg+R+qb(),{pierce:fx.pierce,srcName:HC[inst.id].name});
  if(fx.block) F.block+=fx.block+R;
  if(fx.heal) healHero(F,fx.heal+R);
  if(fx.selfDmg) loseHp(F,fx.selfDmg,HC[inst.id].name);
  if(fx.aoe){ const n=fx.aoe+R+qb(); B.field.slice().forEach(c=>damageCreature(c,n,{})); damageBoss(n,{src:HC[inst.id].name}); }
  if(C.over) return;
  if(fx.volley){ B.field.slice().forEach(c=>damageCreature(c,has(c,'fly')?2:1,{})); damageBoss(1,{}); }
  if(fx.tokens) for(let i=0;i<fx.tokens[0];i++) summon(F,TOKENS[fx.tokens[1]],{token:true});
  if(fx.pump){ const cr=getAlly(F); if(cr && !tryProtect(cr,HC[inst.id].name)){ const b=fx.pump.token&&cr.token?1:0; cr.temp.atk+=fx.pump.atk+b; cr.temp.hp+=fx.pump.hp+b; log(`${cr.name} gets +${fx.pump.atk+b}/+${fx.pump.hp+b}.`);} }
  if(fx.untapOne){ const cr=getAlly(F); if(cr && !tryProtect(cr,HC[inst.id].name)) cr.tapped=false; }
  if(fx.packHowl){ const w=Math.min(fx.packHowl,F.field.filter(c=>c.tags.includes('wolf')||/Wolf/.test(c.name)).length); F.field.forEach(c=>c.temp.atk+=w); log(`Pack Howl: +${w} ATK to every creature.`); }
  if(fx.countersAll) F.field.forEach(c=>{ if(!isImmune(c)) c.counters+=fx.countersAll; });
  if(fx.untapAll) F.field.forEach(c=>{ if(!isImmune(c)) c.tapped=false; });
  if(fx.pumpAll) F.field.forEach(c=>{ if(!isImmune(c)) c.temp.atk+=fx.pumpAll; });
  if(fx.raise){ for(let i=0;i<fx.raise.n&&F.dead.length;i++){ const di=F.dead.pop(); const cr=summon(F,HC[di.id],{inst:di,noEtb:false,noHasteAttack:true}); cr.tapped=true; if(fx.raise.counter) cr.counters++; if(fx.raise.atk) cr.atkBonus+=fx.raise.atk; if(fx.raise.exile) cr.exileAfter=true; } }
  if(fx.freeze){ B.field.filter(c=>!c.tapped&&!isImmune(c)).sort((a,b)=>crValue(b)-crValue(a)).slice(0,fx.freeze).forEach(c=>{ c.tapped=true; c.frozen=true; log(`${c.name} is pinned down.`); }); }
  if(fx.counterShot){ let tc=null; if(inBlock&&C.pending){ const it=C.pending.items[C.sel||0]; if(it&&!it.a.cmd) tc=it.a; }
    if(tc) damageCreature(tc,fx.counterShot+R,{pierce:true}); else damageTarget(F,t,fx.counterShot+R,{pierce:true}); }
  if(fx.cancelAttack&&inBlock&&C.pending){ const it=C.pending.items[C.sel||0]||C.pending.items.find(x=>!x.cancel); if(it){ it.cancel=true; log(`${srcName(it)}'s attack is canceled.`);} }
  if(fx.smoke) { C.smoke=true; log('Smoke Screen: this turn, attacks deal no damage to heroes.'); }
  if(fx.twin){ let kills=0; for(let k=0;k<2;k++){ const tt=k===0?t:getTarget(F); const target=B.field.find(c=>c.uid===tt); const before=target?1:0; damageTarget(F,tt,1+R,{}); if(target&&!crAlive(target)) kills++; if(C.over) return; } if(kills===2) drawCards(F,1); }
  if(fx.mistwalk){ const cr=getAlly(F); if(cr && !tryProtect(cr,HC[inst.id].name)){ cr.mist=true; log(`${cr.name} slips into the mist.`);} }
  if(fx.offering){ const cr=getAlly(F,'weak'); if(cr && !tryProtect(cr,HC[inst.id].name)){ const n=effAtk(cr); log(`${p.name} sacrifices ${cr.name}.`); killCreature(cr,null); damageTarget(F,getTarget(F),n,{}); } }
  if(fx.bloodprice){ const k=Math.max(0,Math.min(fx.bloodprice,p.hp-3,HAND_MAX-F.hand.length,F.draw.length)); if(k){ loseHp(F,k,'Bloodprice'); drawCards(F,k);} }
  if(fx.curse){ const tc=B.field.find(c=>c.uid===t); if(tc && tryProtect(tc,HC[inst.id].name)){} else if(tc) tc.curse+=fx.curse; else B.curse+=fx.curse; }
  if(fx.destroy){ const tc=pickDestroy(F,fx.destroy); if(tc && !tryProtect(tc,HC[inst.id].name)){ if(fx.destroy.exile) exileCreature(tc); else killCreature(tc,null);} }
  if(fx.shieldAll) F.field.forEach(c=>{ if(!isImmune(c)) c.shield+=fx.shieldAll; });
  if(fx.hammer){ const cr=getAlly(F); if(cr) damageTarget(F,t,effAtk(cr)+cr.shield+R,{}); }
  if(fx.delve){ const j=F.draw.findIndex(x=>{ const ty=HC[x.id].type; return ty==='artifact'||ty==='equipment'; }); if(j>=0&&F.hand.length<HAND_MAX){ F.hand.push(F.draw.splice(j,1)[0]); } else drawCards(F,1); }
  if(fx.draw) drawCards(F,fx.draw);
  if(fx.recall){ recallBest(F); }
}

function goToCombat(){
  const C=G.combat, F=activeF(); if(!requireActiveHero()||!F||C.step!=='main1') return false;
  F.atkSel={}; C.step='attack'; return true;
}
function endHeroTurn(){
  const C=G.combat, F=activeF(); if(!requireActiveHero()||!F) return false;
  if(C.step==='main1') return goToCombat();
  if(C.step==='attack') declareAttack([]); if(C.over) return true;
  for(const cr of F.field.slice()){ const e=cr.def.eot; if(!e||cr.tapped) continue;
    if(e.wolfIfUntapped&&F.field.filter(c=>c.name==='Wolf').length<e.wolfIfUntapped) summon(F,TOKENS.wolf,{token:true});
    if(e.pingIfUntapped){ const t=C.boss.field.slice().sort((a,b)=>hpLeft(a)-hpLeft(b))[0]; if(t) damageCreature(t,1,{pierce:true}); else damageBoss(1,{pierce:true,src:cr.name}); }
    if(e.healIfUntapped){ const w=liveF().sort((a,b)=>FP(a).hp-FP(b).hp)[0]; if(w) healHero(w,e.healIfUntapped); }
    if(C.over) return true; }
  startHeroTurn(C.active+1); return true;
}
function retreat(){
  const C=G.combat, F=activeF(); if(!requireActiveHero()||!F) return false; const p=FP(F);
  F.out=true; F.retreated=true; F.field.slice().forEach(leavePlay); F.bench=F.field; F.field=[]; const l=Math.min(2,p.gold); p.gold-=l; log(`🏃 ${p.name} retreats (−${l} gold).`);
  if(liveF().length===0){ endCombat(null); return true; }
  startHeroTurn(C.active+1); return true;
}

// ---------- commander turn ----------
function bossDraw(){ const B=G.combat.boss; if(!B.deck.length){ if(!B.used.length) return; B.deck=shuffle(B.used); B.used=[]; } B.hand.push(B.deck.pop()); }
function bossTurn(){
  const C=G.combat, B=C.boss; if(C.over) return; C.phase='bossMain'; const sc=SCALE[Math.min(4,NP())];
  B.field.forEach(c=>{ if(c.frozen){ c.frozen=false; } else c.tapped=false; if(c.def.regen) c.dmg=0; });
  B.temp=0;
  const add=sc.mana+(B.relics.includes('crown')&&C.round>=4?1:0); B.manaPlayed=Math.min(B.manaCap,B.manaPlayed+add); B.mana=B.manaPlayed;
  for(let i=0;i<sc.draw;i++) bossDraw();
  log(`— ${B.name}'s turn · ${B.mana} mana · ${B.hand.length} cards in hand —`);
  if(B.relics.includes('dragonscale')&&C.round%3===0){ B.shield=Math.max(B.shield,3); log('Dragonscale refills.'); }
  if(B.relics.includes('ironWill')) B.shield=Math.min(4,B.shield+1);
  if(B.relics.includes('broodClutch')&&C.round%3===0) summonBoss(EC.whelp,{token:true,name:'Brood Whelp'});
  if(B.relics.includes('warhost')&&B.field.length<2) summonBoss({name:'Orc Warrior',c:{atk:3,hp:3,kw:{}}},{token:true,name:'Orc Warrior'});
  for(const a of B.arts){ if(a==='catapult') bossHit(2,'hero','Siege Catapult'); if(C.over) return; }
  for(const cr of B.field.slice()){ const u=cr.def.upkeep; if(u&&u.ping) bossHit(u.ping,'creatureFirst',cr.name); if(C.over) return; }
  // pre-combat tricks (normal/smart): tap blockers, untap/pump
  if(DIFF().ai!=='easy') bossCast(true);
  if(C.over) return;
  // declare attacks
  const items=[]; const targets=liveF(); if(!targets.length) return;
  items.push({a:cmdObj(), tgt:pickHeroTarget(0), blk:null, cancel:false});
  bossChooseAttackers().forEach((cr,i)=>{ cr.tapped=true; items.push({a:cr,tgt:pickHeroTarget(i+1),blk:null,cancel:false,bonus:0}); });
  const rallies=items.filter(it=>!it.a.cmd&&has(it.a,'rally')).length; items.forEach(it=>{ if(!it.a.cmd) it.bonus=rallies-(has(it.a,'rally')?1:0); });
  log(`${B.name} attacks: ${items.map(it=>`${srcName(it)} (${atkOf(it)}) → ${FP(it.tgt).name}`).join(', ')}.`);
  openBlockStep(items,'main');
}
function cmdObj(){ return {cmd:true, name:G.combat.boss.name, kw:{}, eq:[], side:'boss', tags:[]}; }
function pickHeroTarget(i){
  const L=liveF(), ai=DIFF().ai; if(ai==='easy') return L[ri(L.length)];
  const s=L.slice().sort((a,b)=>(FP(a).hp+a.block)-(FP(b).hp+b.block));
  if(ai==='smart') return s[0];
  return s[i%s.length];
}
function bossChooseAttackers(){
  const B=G.combat.boss, ai=DIFF().ai; const blockers=allHeroCreatures().filter(b=>!b.tapped&&!has(b,'noblock'));
  const out=[];
  for(const a of B.field){ if(a.tapped||effAtk(a)<=0) continue;
    if(ai==='easy'){ out.push(a); continue; }
    if(has(a,'taunt')&&blockers.length&&ai==='smart') continue;
    const could=blockers.filter(b=>canBlock(b,a));
    const dies=could.some(b=>(effAtk(b)>=hpLeft(a)+a.shield||has(b,'dt'))&&!(has(a,'first')&&effAtk(a)>=hpLeft(b)+b.shield));
    if(!dies||could.every(b=>effAtk(a)>=hpLeft(b)+b.shield)||(ai==='normal'&&rnd()<0.25)) out.push(a);
  }
  return out;
}
function openBlockStep(items,resume){
  const C=G.combat; C.pending={items,resume}; C.phase='block'; C.sel=0; C.blockFi=0;
  const anyBlock=items.some(it=>allHeroCreatures().some(b=>canBlock(b,it.a)));
  const anyInstant=liveF().some(F=>F.hand.some(h=>HC[h.id].type==='instant'&&!whyNot(F,h,true)));
  if(!anyBlock&&!anyInstant) confirmBlocks();
}
function assignBlock(ai,uid){ // attacker index, hero creature uid (or '' to clear)
  const C=G.combat; if(!C||C.phase!=='block') return false; const it=C.pending.items[ai]; if(!it) return false;
  if(!uid){ if(it.blk && !ownsCreature(it.blk)) return false; it.blk=null; return true; }
  const b=allHeroCreatures().find(c=>c.uid===uid); if(!b||!ownsCreature(b)) return false;
  if(!canBlock(b,it.a)) return false;
  C.pending.items.forEach(x=>{ if(x.blk===b) x.blk=null; }); it.blk=b; return true;
}
function confirmBlocks(){
  const C=G.combat; if(!C||C.phase!=='block') return false; const P_=C.pending; C.pending=null;
  // (each block is logged as it resolves in fightPair)
  C.phase='resolving';
  resolveAttacks(P_.items,'heroes');
  if(C.over) return true;
  C.phase='bossMain';
  if(P_.resume==='main'){ bossCast(false); }
  else if(P_.resume==='cont'){ bossCast(false); }
  return true;
}
function bossCastable(id,pre){
  const C=G.combat, B=C.boss, e=EC[id]; if(e.cost>B.mana) return false; if(e.type==='instant') return false;
  const hc=allHeroCreatures(); const fx=e.fx||{};
  if(pre){ return (fx.tap&&hc.some(c=>!c.tapped))||(fx.untapPump&&B.field.length>=2); }
  if(fx.untapPump) return false;
  if(fx.tap) return false; // tap tricks are used before combat
  if(fx.hitCre&&!hc.length&&false) return false;
  if(fx.raise) return B.dead.length>0;
  if(fx.corpse) return B.field.length>0&&hc.length>=2;
  if(fx.destroyTapped) return hc.some(c=>c.tapped);
  if(fx.exileHand||fx.decree) return liveF().some(F=>F.hand.length);
  if(e.type==='artifact') return !B.arts.includes(id)||id==='catapult';
  return true;
}
function bossCast(pre){
  const C=G.combat, B=C.boss, ai=DIFF().ai; let guard=0;
  while(!C.over && guard++<20){
    const opts=B.hand.map((id,i)=>({id,i})).filter(o=>bossCastable(o.id,pre)); if(!opts.length) break;
    let ch;
    if(ai==='easy'){ if(rnd()<0.25) break; ch=opts[ri(opts.length)]; }
    else ch=opts.sort((x,y)=>bossScore(y.id)-bossScore(x.id))[0];
    const id=ch.id, e=EC[id]; B.hand.splice(B.hand.indexOf(id),1); B.mana-=e.cost;
    log(`${B.name} plays ${e.name}.`);
    if(e.type!=='creature'&&e.type!=='artifact'&&luckyCancel()){ B.used.push(id); continue; }
    if(e.type==='creature'){ const cr=summonBoss(e,{id}); if(has(cr,'haste')&&!pre&&liveF().length){ cr.tapped=true; const it={a:cr,tgt:pickHeroTarget(0),blk:null,cancel:false,bonus:0}; log(`${cr.name} has Haste and attacks ${FP(it.tgt).name}!`); openBlockStep([it],'cont'); return; } }
    else if(e.type==='artifact'){ B.arts.push(id); }
    else { bossFx(e); B.used.push(id); }
  }
  if(!pre && !C.over && C.phase!=='block') endBossTurn();
}
function bossScore(id){
  const e=EC[id], fx=e.fx||{}, hc=allHeroCreatures(); let s=e.cost*2;
  if(e.type==='creature') s+=3;
  if(fx.hitHero){ if(liveF().some(F=>FP(F).hp+F.block<=fx.hitHero)) s+=50; }
  if(fx.hit||fx.hitCre){ const n=fx.hit||fx.hitCre; if(hc.some(c=>hpLeft(c)+c.shield<=n&&crValue(c)>=4)) s+=6; else if(!hc.length&&fx.hitCre) s-=2; }
  if(fx.destroyTapped) s+=8; if(fx.aoeHeroes) s+=hc.length*2; if(fx.tap) s+=hc.filter(c=>!c.tapped).length*2;
  return s;
}
function bossHit(n,mode,src){ // mode: any | creature | creatureFirst | hero
  const C=G.combat, ai=DIFF().ai; const L=liveF(); if(!L.length) return;
  const hc=allHeroCreatures(); const taunts=hc.filter(c=>has(c,'taunt')&&!c.tapped);
  if(mode!=='hero'){
    let pool=taunts.length?taunts:hc;
    if(pool.length&&(mode!=='any'||taunts.length||ai==='easy'&&rnd()<0.5||pool.some(c=>hpLeft(c)+c.shield<=n&&crValue(c)>=4))){
      const kill=pool.filter(c=>hpLeft(c)+c.shield+c.armor<=n).sort((a,b)=>crValue(b)-crValue(a))[0];
      const t=kill||pool.slice().sort((a,b)=>crValue(b)-crValue(a))[0]; log(`${src} hits ${t.name} for ${n}.`); damageCreature(t,n,{}); return; }
  }
  const h=pickHeroTarget(0); damageHero(h,n,src);
}
function pickSpellCreature(mode,n){
  const hc=allHeroCreatures(); const taunts=hc.filter(c=>has(c,'taunt')&&!c.tapped);
  if(mode==='hero') return null;
  let pool=taunts.length?taunts:hc;
  if(!pool.length) return null;
  const ai=DIFF().ai;
  if(!(mode!=='any'||taunts.length||ai==='easy'&&rnd()<0.5||pool.some(c=>hpLeft(c)+c.shield<=n&&crValue(c)>=4))) return null;
  const kill=pool.filter(c=>hpLeft(c)+c.shield+c.armor<=n).sort((a,b)=>crValue(b)-crValue(a))[0];
  return kill||pool.slice().sort((a,b)=>crValue(b)-crValue(a))[0];
}
function bossFx(e){
  const C=G.combat, B=C.boss, fx=e.fx, hc=allHeroCreatures();
  // Targeted enemy spells can be canceled by Ward (first time each fight). AOE and untargeted effects are not "targeting."
  if(fx.hit || fx.hitCre){
    const mode=fx.hit?'any':(hc.length?'creature':'hero');
    const n=fx.hit||fx.hitCre;
    const t=pickSpellCreature(mode,n);
    if(t && tryProtect(t,e.name)) return;
    if(t && tryWard(t,e.name)) return;
    if(t){ log(`${e.name} hits ${t.name} for ${n}.`); damageCreature(t,n,{}); }
    else { const h=pickHeroTarget(0); damageHero(h,n,e.name); }
  }
  if(fx.hitHero){ const h=pickHeroTarget(0); damageHero(h,fx.hitHero,e.name); }
  if(fx.heal) B.hp=Math.min(B.maxHp,B.hp+fx.heal);
  if(fx.tap){
    const picks=hc.filter(c=>!c.tapped&&!isImmune(c)).sort((a,b)=>crValue(b)-crValue(a)).slice(0,fx.tap);
    const a=picks.find(c=>canAwaken(c));
    if(a){ tryProtect(a,e.name); return; }
    const w=picks.find(c=>has(c,'ward')&&!c.wardUsed);
    if(w){ tryWard(w,e.name); return; }
    picks.forEach(c=>{ c.tapped=true; log(`${c.name} is tapped.`); });
  }
  if(fx.aoeHeroes){ hc.slice().forEach(c=>damageCreature(c,fx.aoeHeroes,{})); liveF().forEach(F=>damageHero(F,fx.aoeHeroes,e.name)); }
  if(fx.raise){ for(let i=0;i<fx.raise&&B.dead.length;i++){ const id=B.dead.pop(); summonBoss(EC[id],{id}); } }
  if(fx.corpse){ const v=B.field.slice().sort((a,b)=>effAtk(b)-effAtk(a))[0]; const n=effAtk(v); log(`${B.name} explodes ${v.name}!`); killCreature(v,null); hc.slice().forEach(c=>damageCreature(c,n,{})); }
  if(fx.exileHand){ const fs=liveF().filter(F=>F.hand.length); if(fs.length){ const F=pick(fs); const inst=F.hand.splice(ri(F.hand.length),1)[0]; if(!HC[inst.id].junk) FP(F).exiled++; log(`✖ ${HC[inst.id].name} is exiled from ${FP(F).name}'s hand.`);} }
  if(fx.decree){ liveF().forEach(F=>{ if(F.hand.length){ const inst=F.hand.splice(ri(F.hand.length),1)[0]; if(!HC[inst.id].junk) FP(F).exiled++; log(`✖ Decree: ${HC[inst.id].name} is exiled from ${FP(F).name}'s hand.`);} }); }
  if(fx.untapPump){ B.field.forEach(c=>{ c.tapped=false; c.temp.atk+=1; }); B.temp+=1; }
  if(fx.destroyTapped){ const t=hc.filter(c=>c.tapped&&!isImmune(c)).sort((a,b)=>crValue(b)-crValue(a))[0]; if(t){ if(tryProtect(t,e.name)) return; if(tryWard(t,e.name)) return; log(`Crushing Blow destroys ${t.name}.`); killCreature(t,null);} }
  if(fx.cleave){
    const s=hc.slice().sort((a,b)=>crValue(b)-crValue(a));
    const a=(s[0]&&canAwaken(s[0]))?s[0]:(s[1]&&canAwaken(s[1]))?s[1]:null;
    if(a){ tryProtect(a,e.name); return; }
    const w=(s[0]&&has(s[0],'ward')&&!s[0].wardUsed)?s[0]:(s[1]&&has(s[1],'ward')&&!s[1].wardUsed)?s[1]:null;
    if(w){ tryWard(w,e.name); return; }
    if(s[0]) damageCreature(s[0],fx.cleave[0],{}); else bossHit(fx.cleave[0],'hero',e.name); if(s[1]) damageCreature(s[1],fx.cleave[1],{}); else bossHit(fx.cleave[1],'hero',e.name);
  }
}
function endBossTurn(){
  const C=G.combat, B=C.boss; if(C.over) return;
  B.field.forEach(c=>{ c.temp={atk:0,hp:0}; }); B.temp=0; B.curse=Math.max(0,B.curse);
  B.field.slice().forEach(c=>{ if(c.dmg>=effHp(c)) killCreature(c,null); });
  C.round++;
  startHeroTurn(0);
}

// ---------- end of fight ----------
function cleanupFighter(F){
  const p=FP(F); const keep=[];
  for(const inst of F.hand) if(!inst.junk&&!HC[inst.id].junk) keep.push(inst);
  keep.push(...F.draw);
  for(const cr of F.field.concat(F.bench)){ if(cr.token||!cr.inst) { for(const e of cr.eq) keep.push(e); continue; }
    if(cr.exileAfter){ p.exiled++; for(const e of cr.eq) returnToSupply(p,e); continue; }
    keep.push(cr.inst); keep.push(...cr.eq); }
  keep.push(...F.arts);
  for(const inst of F.used.concat(F.dead)) if(!HC[inst.id].junk) returnToSupply(p,inst);
  p.owned=keep.filter(x=>!x.junk);
  p.mana=p.mana.filter((id,i)=>true); // mana cards are kept; Wild Crystals played this fight are exiled
  for(const x of F.manaIn) if(MANA[x.id].exileAfter){ const k=p.mana.indexOf(x.id); if(k>=0) p.mana.splice(k,1); }
  p.blessed=0;
}
function endCombat(won){
  const C=G.combat; if(!C||C.over) return; C.over=true; C.won=won; C.phase='over';
  const B=C.boss;
  if(won===true) log(`🏆 ${B.name} is defeated!`); else if(won===false) log(`💀 The heroes are defeated by ${B.name}.`); else log('The heroes withdraw from the fight.');
}
function leaveCombat(){
  const C=G.combat; if(!C||!C.over) return false; const B=C.boss, won=C.won;
  G.stats.fights.push({cid:C.cid, kind:C.kind, won:won===true, round:G.round, rounds:C.round, n:C.fighters.length});
  for(const F of C.fighters) cleanupFighter(F);
  if(won===true){
    const winners=C.fighters.filter(F=>!F.out).map(FP);
    if(C.kind==='stop'){ G.cleared[C.stop]=true; G.herald=0; winners.forEach(p=>{ gainGold(p,STOP_REWARD.gold,'victory'); gainMats(p,STOP_REWARD.mats); heal(p,STOP_REWARD.heal); }); }
    else if(C.kind==='quest'){ const q=QUESTS.find(x=>x.id===C.qid); G.players.forEach(p=>{ p.quests=p.quests.filter(x=>x!==C.qid); }); G.questDeck.unshift(C.qid); winners.forEach(p=>{ gainGold(p,q.reward.gold,'quest'); gainMats(p,q.reward.mats); }); }
  }
  if(C.kind!=='town'){
    for(const F of C.fighters){ const p=FP(F); if(F.out&&!F.retreated) heroFalls(p); }
  }
  G.combat=null;
  if(C.kind==='town'){ return true; }
  if(won===true&&C.kind==='boss'){ endGame(true,`Malgrath the Iron Warlord falls! Thornhold is free (round ${G.round}).`); return true; }
  checkAllDead(); return true;
}
// keep the fight moving if the active hero fell on their own turn
function combatTick(){
  const C=G.combat; if(!C||C.over) return;
  if(C.phase==='hero'){ const F=C.fighters[C.active]; if(F&&F.out) startHeroTurn(C.active+1); }
}

const TYPE_ICON={creature:'🐾', spell:'✨', instant:'⚡', artifact:'⚙️', equipment:'🗡️'};
const kwText = kw => Object.keys(kw||{}).filter(k=>kw[k]&&KW[k]).map(k=>KW[k]).join(', ');
function priceTag(g){ return `<div class="cost">${g}🪙</div>`; }
function artPath(kind, id){
  if(typeof CARD_ART==='undefined' || !id) return '';
  return CARD_ART[kind+':'+id] || CARD_ART['hc:'+id] || '';
}
function artForInst(inst){ const id=typeof inst==='string'?inst:(inst&&inst.id); return artPath('hc', id); }
function artForMana(id){ return artPath('mana', id); }
function artForRelic(id){ return artPath('relic', id); }
function artForBossRelic(id){ return artPath('boss_relic', id); }
function artForEnemy(id){ return artPath('enemy', id); }
function artForBoss(id){ return artPath('boss', id); }
function artForHeroFac(f){ return (typeof HERO_ART_FAC!=='undefined' && HERO_ART_FAC[f]) || artPath('hero', f); }
function artForCreature(cr){
  if(!cr) return '';
  if(cr.formId) return artPath('hc', cr.formId) || artPath('hc', cr.id);
  if(cr.id && cr.inst && cr.id!==cr.inst.id) return artPath('hc', cr.id) || artForInst(cr.inst);
  if(cr.inst) return artForInst(cr.inst);
  if(cr.id) return artForEnemy(cr.id) || artPath('hc', cr.id) || artPath('token', cr.id);
  if(typeof TOKENS!=='undefined'){
    for(const k of Object.keys(TOKENS)){ if(TOKENS[k].name===cr.name) return artPath('token', k); }
  }
  if(/zombie/i.test(cr.name||'')) return artPath('token','zombie');
  return '';
}
function zoomBtn(src){ return src?`<button type="button" class="zoom-btn" data-a="zoom" data-v="${esc(src)}" title="Zoom card" aria-label="Zoom card">🔍</button>`:''; }
function faceImg(src, alt){ return src?`<img class="cardface" src="${esc(src)}" alt="${esc(alt||'')}" draggable="false">`:''; }
function relicChip(id, boss){
  const R=boss?ERELICS[id]:RELICS[id]; if(!R) return '';
  const src=boss?artForBossRelic(id):artForRelic(id);
  const zoom=src?` data-zoom="${esc(src)}" data-a="zoom" data-v="${esc(src)}"`:'';
  const img=src?`<img src="${esc(src)}" alt="">`:'';
  return `<span class="chip ${boss?'eperk':'relic'}${src?' artchip':''}" title="${esc(R.name+': '+R.text)}"${zoom}>${img}<span class="chip-name">${esc(R.name)}</span></span>`;
}

function showCardZoom(src, pinned){
  if(!src) return;
  ensureZoom();
  const z=document.getElementById('cardzoom');
  const img=z.querySelector('img');
  img.src=src; img.alt='Card preview';
  z.classList.add('show');
  z.classList.toggle('pinned', !!pinned);
  UI.zoomSrc=src; UI.zoomPinned=!!pinned;
}
function hideCardZoom(force){
  const z=document.getElementById('cardzoom'); if(!z) return;
  if(UI.zoomPinned && !force) return;
  z.classList.remove('show','pinned'); UI.zoomPinned=false; UI.zoomSrc=null;
}
function ensureZoom(){
  if(document.getElementById('cardzoom')) return;
  const z=document.createElement('div');
  z.id='cardzoom';
  z.innerHTML='<button type="button" class="cardzoom-close" data-a="closeZoom" title="Close">×</button><img alt="">';
  document.body.appendChild(z);
  z.addEventListener('click', ev=>{ if(ev.target===z) hideCardZoom(true); });
  document.addEventListener('keydown', ev=>{ if(ev.key==='Escape') hideCardZoom(true); });
  document.addEventListener('pointermove', ev=>{
    if(ev.pointerType && ev.pointerType!=='mouse'){ UI.zoomHover=false; return; }
    if(ev.movementX===0 && ev.movementY===0) return;
    UI.zoomHover=true;
    if(UI.zoomPinned) return;
    const el=ev.target.closest && ev.target.closest('[data-zoom]');
    if(el) showCardZoom(el.getAttribute('data-zoom'), false);
  }, {passive:true});
  document.addEventListener('pointerover', ev=>{
    if(ev.target.closest && ev.target.closest('.combat-hand')) UI.handHover=true;
    if(ev.pointerType && ev.pointerType!=='mouse') return;
    const el=ev.target.closest && ev.target.closest('[data-zoom]');
    if(!el || UI.zoomPinned || !UI.zoomHover) return;
    showCardZoom(el.getAttribute('data-zoom'), false);
  });
  document.addEventListener('pointerout', ev=>{
    const fromH=ev.target.closest && ev.target.closest('.combat-hand');
    const toH=ev.relatedTarget && ev.relatedTarget.closest && ev.relatedTarget.closest('.combat-hand');
    if(fromH && !toH) UI.handHover=false;
    if(UI.zoomPinned) return;
    if(ev.pointerType && ev.pointerType!=='mouse') return;
    const from=ev.target.closest && ev.target.closest('[data-zoom]');
    const to=ev.relatedTarget && ev.relatedTarget.closest && ev.relatedTarget.closest('[data-zoom]');
    if(from && !to) hideCardZoom(false);
  });
}

function helpHTML(){
  return `<details class="help panel" style="margin-top:10px"><summary><b>How to play (v3 rules)</b></summary>
  <p><b>Goal:</b> co-op. Beat the 3 Gauntlet commanders in order (Bandit Chief, Drake Lord, Lich) and then Malgrath the Iron Warlord (unlocked after ${WARLORD_UNLOCK} stops). You have ${ROUND_LIMIT} rounds; after round ${ROUND_LIMIT} a hero who falls is dead for good, and you lose if every hero is dead. Escalation at rounds ${ESCALATE_ROUNDS.join(', ')} gives commanders +10% HP each.</p>
  <p><b>Decks:</b> pick any of the 4 prebuilt decks. Each is one 100-card deck split into 3 stacks (Creatures, Spells, Artifacts). Your faction only sets your 3 Relics and your location perks. You start with the 17 starter 1/1 creatures and 3 Plain Mana, plus ${START_GOLD} gold, and earn ${INCOME} gold per round. Better cards come from shops, packs and upgrades — not from the opening deck.</p>
  <p><b>Board:</b> roll a d6 and move forward exactly that many spaces, or stop early on a location (one way only). From the Crossroads the road runs down the middle to the Tavern and Mage Tower, then to the Shrine, where you choose the left loop (Forest, Beast Den, Abbey) or the right loop (Mine, Forge, Hunter's Lodge, Ruins). Both lead back to the Crossroads. You may also stay put. You can't use the same location two rounds in a row. Colored road spaces flip an event card.</p>
  <p><b>Shops:</b> the Beast Den and Hunter's Lodge reveal 5 cards from your Creature stack, the Mage Tower from your Spell stack, and the Forge from your Artifact stack. Buy up to 3; every card you don't buy is <b>exiled</b> for good. The Tavern sells mana cards (Plain Mana always in stock, plus 2 special mana from a shared Tavern stack) and quests. The Forge also spends materials on permanent upgrades.</p>
  <p><b>Cards are spent:</b> a card you play (and a creature that dies, with its equipment) goes back into your Supply Deck, and you must buy it again. Creatures and artifacts still in play when the fight ends, and unplayed cards, stay yours. If your deck runs dry in a fight you draw one junk card per turn.</p>
  <p><b>Quests</b> pay materials (${Object.values(MATS).map(m=>m.icon+' '+m.name).join(', ')}) plus a little gold. Fight quests are called like any fight; errands complete for free when you reach their location.</p>
  <p><b>Call to Fight:</b> instead of a location action, call the next Gauntlet commander, one of your fight quests, or Malgrath, from anywhere. Others accept or decline; if anyone declines, the ones who accepted get another chance to back out, until nobody changes their mind. Then the caller fights or backs out.</p>
  <p><b>Cards:</b> hover a card (or tap the 🔍) to see the full painted card.</p>
  <p><b>Combat:</b> each fight starts at 0 mana. Your mana cards are a separate mana hand: play 1 per turn; it stays in play and gives mana every turn (special mana may enter <i>sick</i> and give nothing on the turn you play it). Mana and cards can be played the same turn. Your hand is the free Basic Strike (once per turn) plus up to ${HAND_BOUGHT} bought cards, refilled each turn ${G&&G.drawOrder==='random'?'at random':'in the order you bought them'}.</p>
  <p><b>Turn order:</b> each hero's turn starts with a <b>first main</b> (play 1 mana card and play cards), then <b>combat</b> (choose attackers; attacking taps them, so they can't block his next attack), then a <b>second main</b> to play more cards. You may play only 1 mana card per turn, across both main phases. New creatures enter <b>tapped</b>. On the commander's turn he untaps, attacks with himself and his creatures, and you choose blockers from your untapped creatures; blockers deal their ATK back. Then he plays mana and cards from his own deck. You can cast instants while blocking.</p>
  <p><b>Shields:</b> a hit is reduced by the Shield count, then the creature (or commander) loses 1 Shield, whatever the hit size. <b>Keywords:</b> ${Object.keys(KW).map(k=>`<b>${KW[k]}</b>: ${KW_HELP[k]}`).join(' ')} <b>Armor</b>: ${KW_HELP.armor}</p>
  <p><b>Difficulty:</b> ${Object.values(DIFFS).map(d=>`<b>${d.name}</b>: ${d.text}`).join(' ')} Commanders scale with the number of heroes in the game. Lone Hero (solo): +${SOLO_HP} max HP, +${SOLO_INCOME} income, +${SOLO_MANA} mana every turn in fights.</p></details>`;
}

const SPACE_FILL={plain:'#d8c49a',event:'#e0b84a',good:'#7fbf6a',bad:'#c8645a'};
const SPACE_ICON={plain:'',event:'?',good:'+',bad:'−'};
function renderBoard(){

   <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4a22"/></marker></defs>
   <text x="590" y="372" text-anchor="middle" font-size="12" fill="#5a3a12" font-family="Georgia">↓ down the middle</text>
   <text x="150" y="720" font-size="15" fill="#3b2a12" font-family="Georgia" font-weight="bold">◀ LEFT LOOP</text><text x="980" y="740" font-size="15" fill="#3b2a12" font-family="Georgia" font-weight="bold">RIGHT LOOP ▶</text>`;
  for(const r of Object.values(ROUTE)) for(let i=0;i<r.length-1;i++){ const A=LOCS[r[i]],B=LOCS[r[i+1]]; const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy)||1; const ra=A.kind==='space'?14:34, rb=B.kind==='space'?16:36;
    svg+=`<line x1="${A.x+dx/L*ra}" y1="${A.y+dy/L*ra}" x2="${B.x-dx/L*rb}" y2="${B.y-dy/L*rb}" stroke="#6b4a22" stroke-width="4" stroke-dasharray="3 7" stroke-linecap="round" marker-end="url(#arr)"/>`; }
  for(const id in LOCS){ const L=LOCS[id]; const re=dist[id]!==undefined;
    if(L.kind==='space'){ const t=G.spaces[id];
      svg+=`<g class="node ${re?'reach':''}" ${re?`data-a="move" data-v="${id}"`:''}><title>${esc(SPACE_INFO[t])}</title><circle class="ring" cx="${L.x}" cy="${L.y}" r="14" fill="${SPACE_FILL[t]}" stroke="#5a3d1c" stroke-width="2"/><text x="${L.x}" y="${L.y+5}" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a1a08">${SPACE_ICON[t]}</text></g>`;
    } else {
      svg+=`<g class="node ${re?'reach':''}" ${re?`data-a="move" data-v="${id}"`:''} filter="url(#sh)"><title>${esc(L.name+': '+L.desc)}</title><circle class="ring" cx="${L.x}" cy="${L.y}" r="34" fill="#f3e2b8" stroke="#5a3d1c" stroke-width="3"/><text x="${L.x}" y="${L.y+10}" text-anchor="middle" font-size="28">${L.icon}</text><text x="${L.x}" y="${L.y+52}" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a1a08" font-family="Georgia">${esc(L.name.replace('The Prancing Boar ',''))}</text></g>`;
    }
    if(re) svg+=`<text x="${L.x}" y="${L.y-(L.kind==='space'?20:40)}" text-anchor="middle" font-size="12" fill="#7a4a00" font-weight="bold">${dist[id]}</text>`;
  }
  G.players.forEach((q,i)=>{ if(q.dead) return; const L=LOCS[q.loc]; const ox=(i-1.5)*13; svg+=`<circle cx="${L.x+ox}" cy="${L.y-(L.kind==='space'?22:44)}" r="9" fill="${PCOLORS[i]}" stroke="${i===G.cur?'#fff':'#000'}" stroke-width="${i===G.cur?3:1.5}"><title>${esc(q.name)}</title></circle>`; });
  return svg+'</svg>';

function renderLocPanel(){

    if(m.stage!=='final'){

function crHTML(cr,o){ o=o||{};
  const cls=['cr']; if(cr.side==='boss') cls.push('boss'); if(cr.token) cls.push('token'); if(cr.tapped) cls.push('tapped'); if(o.atk) cls.push('atk'); if(o.ally) cls.push('ally'); if(o.tgt) cls.push('tgt'); if(cr.awakened) cls.push('awakened'); if(G.combat&&G.combat.flash&&G.combat.flash.uid===cr.uid) cls.push('awaken-flash');
  const kws=Object.keys(KW).filter(k=>has(cr,k)).map(k=>KW[k]); if(cr.armor) kws.push('Armor '+cr.armor); if(cr.immune) kws.push('Immune');
  const eq=cr.eq.map(e=>HC[e.id].name).join(', ');
  const src=artForCreature(cr);
  const face=(cr.formId&&HC[cr.formId])||(cr.id&&HC[cr.id]&&(!cr.inst||cr.id!==cr.inst.id)?HC[cr.id]:null)||(cr.inst?HC[cr.inst.id]:null);
  const title=esc((face?face.name+': '+face.text:cr.name)+(kws.length? ' · '+kws.join(', '):'')+(eq? ' · '+eq:''));
  if(src){
    cls.push('artcr');
    return `<div class="${cls.join(' ')}" ${o.attrs||''} data-zoom="${esc(src)}" title="${title}">${cr.shield?`<div class="sh">🛡${cr.shield}</div>`:''}${faceImg(src,cr.name)}${zoomBtn(src)}<div class="pt">${effAtk(cr)}/${hpLeft(cr)}${cr.counters?` +${cr.counters}`:''}${eq?' 🗡':''}</div>${cr.tapped?'<div class="muted">tapped</div>':''}</div>`;
  }
  return `<div class="${cls.join(' ')}" ${o.attrs||''} title="${title}">${cr.shield?`<div class="sh">🛡${cr.shield}</div>`:''}<div class="mn">${esc(cr.name)}</div><div class="kw">${esc(kws.join(', '))}${cr.counters?` <span class="ctr">+${cr.counters}</span>`:''}</div>${eq?`<div class="eq">🗡 ${esc(eq)}</div>`:''}<div class="pt">${effAtk(cr)}/${hpLeft(cr)}</div>${cr.tapped?'<div class="muted">tapped</div>':''}</div>`;
}
function fighterBonusHTML(Fx){
  const p=FP(Fx);
  const bits=[];
  p.relics.forEach(r=>{ const c=relicChip(r,false); if(c) bits.push(c); });
  Fx.arts.forEach(a=>{ const asrc=artForInst(a); bits.push(`<span class="chip${asrc?' artchip':''}" title="${esc(HC[a.id].text)}"${asrc?` data-zoom="${esc(asrc)}" data-a="zoom" data-v="${esc(asrc)}"`:''}>${asrc?`<img src="${esc(asrc)}" alt="">`:''}⚙️ ${esc(HC[a.id].name)}</span>`); });
  Fx.manaIn.forEach(x=>{ const msrc=artForMana(x.id); bits.push(`<span class="chip${msrc?' artchip':''}" title="${esc(MANA[x.id].text)}"${msrc?` data-zoom="${esc(msrc)}" data-a="zoom" data-v="${esc(msrc)}"`:''}>${msrc?`<img src="${esc(msrc)}" alt="">`:''}💧${esc(MANA[x.id].name)}${x.sick?' (sick)':''}</span>`); });

}

function combatCoach(C,F,myTurn){
  if(C.over) return C.won===true?'You won! Tap Return to town.':'Defeated. Tap Return to town to try again.';
  if(!myTurn&&F) return `It's ${FP(F).name}'s turn. Wait for them to play.`;
  if(C.phase==='block'){
    const mine=TOWN.on?allHeroCreatures().filter(b=>b.owner===TOWN.localPi):allHeroCreatures();
    const can=mine.some(b=>C.pending&&C.pending.items.some(it=>!it.blk&&canBlock(b,it.a)));
    return can?'Tap one of your glowing creatures to block an attack, then tap Confirm blocks. Or tap Confirm blocks to take the hits.':'Tap Confirm blocks to take the hits.';
  }
  if(F&&C.step==='attack'){
    const n=F.field.filter(c=>!c.tapped).length;
    const picked=Object.values(F.atkSel).filter(x=>x).length;
    if(n===0) return "Your creatures are tapped, so they can't attack yet. Tap Don't attack, then you'll have a second main phase to play cards.";
    if(picked===0) return 'Tap one of your glowing creatures to attack the boss, then tap Attack. Or tap Don\'t attack.';
    return `Tap Attack with ${picked} creature${picked===1?'':'s'}, or tap more of your glowing creatures. Or tap Don't attack.`;
  }
  const next=C.step==='main1'?'Combat':'End turn';
  if(F&&!F.manaThisTurn&&F.manaHand.length) return `Tap a glowing mana card (1 per turn), then tap a glowing card to play it. Tap the boss to target him. When you're ready, tap ${next}.`;
  return `Tap a glowing card to play it. Tap the boss to target him. When you're ready, tap ${next}.`;
}
function howtoHTML(){
  return `<div class="howto-ov"><div class="howto-card">
    <h2>How to fight</h2>
    <p class="howto-lead">Your turn has three parts, then the boss takes a turn.</p>
    <ol>
      <li><b>First main:</b> play <b>1 mana card</b> from your mana hand (it stays in play and gives mana every turn) and play cards from your hand. Tap the <b>boss's picture</b> to target him. When you're ready, tap <b>Combat</b>.</li>
      <li><b>Combat:</b> tap your glowing creatures to attack the boss, then tap <b>Attack</b>. Attacking taps them, so they can't block his next attack. If none can attack, tap <b>Don't attack</b>.</li>
      <li><b>Second main:</b> play more cards (you still get only 1 mana card per turn). When you're done, tap <b>End turn</b>.</li>
      <li>On the boss's turn he attacks. Tap your glowing creatures to block, then tap <b>Confirm blocks</b>. You can only block with your own creatures. Blockers deal their ATK back.</li>
      <li>Reduce the boss's health to 0 to win. Tap 🔍 on a card to see it up close.</li>
    </ol>
    <button type="button" class="btn primary howto-gotit" data-a="townHelpClose">Got it</button>
  </div></div>`;
}

function renderCombat(){
  const C=G.combat, B=C.boss; const F=activeF();
  const tg=F?getTarget(F):null;
  const myF=TOWN.on?C.fighters[TOWN.localPi]:null;
  const myTurn=!(!F||(TOWN.on&&F.pi!==TOWN.localPi));
  let h=`<div class="overlay combat-ov"><div class="modal combat-modal"><div class="combat-table">`;
  const bsrc=artForBoss(B.cid);
  const bossBonus=B.relics.map(r=>relicChip(r,true)).join('')+B.arts.map(a=>{ const asrc=artForEnemy(a); return `<span class="chip${asrc?' artchip':''}" title="${esc(EC[a].text)}"${asrc?` data-zoom="${esc(asrc)}" data-a="zoom" data-v="${esc(asrc)}"`:''}>${asrc?`<img src="${esc(asrc)}" alt="">`:''}<span class="chip-name">⚙️ ${esc(EC[a].name)}</span></span>`; }).join('');
  const bossGlow=(TOWN.on&&myTurn&&!C.over&&C.phase!=='block'&&C.step!=='attack')?' coach-glow':'';
  h+=`<div class="bosspanel"><div class="bossbox ${tg==='boss'?'tgt':''}${bossGlow}" data-a="cTarget" data-v="boss">${bsrc?`<img class="boss-art" src="${esc(bsrc)}" alt="${esc(B.name)}" data-zoom="${esc(bsrc)}">`:''}<div><div class="bname">${B.icon} ${esc(B.name)}</div>
   <div class="bar"><i style="width:${Math.max(0,B.hp)/B.maxHp*100}%"></i></div><div class="bstats"><span class="bstats-full">❤ ${Math.max(0,B.hp)}/${B.maxHp} ${B.shield?`· 🛡 Shield ${B.shield}`:''} · ⚔ ATK ${Math.max(0,B.atk-B.curse+B.temp)} · 💧 ${B.manaPlayed} mana in play (max ${B.manaCap}) · ✋ ${B.hand.length} · deck ${B.deck.length}</span><span class="bstats-short">❤ ${Math.max(0,B.hp)}/${B.maxHp}${B.shield?` · 🛡 ${B.shield}`:''} · ⚔ ${Math.max(0,B.atk-B.curse+B.temp)} · 💧 ${B.manaPlayed}/${B.manaCap} · ✋ ${B.hand.length} · deck ${B.deck.length}</span></div></div></div>
   ${bossBonus?`<div class="boss-relics">${bossBonus}</div>`:''}
   <div class="clog">${C.log.slice(0,40).map(l=>`<div>${esc(l)}</div>`).join('')}</div></div>`;
  // phase banner
  let ph='';
  if(C.over) ph=`<b>${C.won===true?'🏆 Victory!':C.won===false?'💀 Defeat':'Withdrawn'}</b> <button class="btn primary" data-a="leave">${TOWN.on?'Return to town':'Continue'}</button>`;
  else if(C.phase==='block') ph=`<b>${esc(B.name)} attacks!</b><span class="phase-hint"> Pick an attack, then click one of your untapped creatures to block it (blockers deal their ATK back). You can cast ⚡ instants now. Then confirm.</span>`;
  else if(F&&C.step==='attack') ph=`<b>${esc(FP(F).name)}: combat.</b>`+(myTurn?`<span class="phase-hint"> Click your untapped creatures to choose attackers (they tap and can't block his next attack), then attack or skip.</span>`:`<span class="phase-hint"> Waiting for ${esc(FP(F).name)} to attack.</span>`);
  else if(F&&C.step==='main2') ph=`<b>${esc(FP(F).name)}: second main.</b>`+(myTurn?`<span class="phase-hint"> Play more cards, then End turn. You may play only 1 mana card per turn.</span>`:`<span class="phase-hint"> Waiting for ${esc(FP(F).name)} to play.</span>`);
  else if(F) ph=`<b>${esc(FP(F).name)}: first main.</b>`+(myTurn?`<span class="phase-hint"> Play 1 mana card and play cards, then go to Combat.</span>`:`<span class="phase-hint"> Waiting for ${esc(FP(F).name)} to play.</span>`);
  h+=`<div class="phase">Round ${C.round} · ${ph}</div>`;
  if(C.flash&&C.flash.text) h+=`<div class="awaken-banner" role="status">${esc(C.flash.text)}</div>`;
  if(TOWN.on) h+=`<div class="coach" role="status"><span class="coach-text">${esc(combatCoach(C,F,myTurn))}</span><button type="button" class="howto-btn" data-a="townHelp" title="How to fight" aria-label="How to fight">?</button></div>`;
  const minePi=TOWN.on?TOWN.localPi:(F?F.pi:null);
  const myCreatures=(list)=> minePi==null?list:list.filter(b=>b.owner===minePi);
  h+=`<div class="combat-fields${C.fighters.length>1?' multi':''}"><div class="battle-row is-foe"><div class="muted">Boss battlefield · ${esc(B.name)} <span class="wide-hint">(click to target)</span></div>${fieldHTML(B.field.map(c=>crHTML(c,{tgt:tg===c.uid,attrs:`data-a="cTarget" data-v="${c.uid}"`})))}</div>`;
  if(C.phase==='block'&&C.pending){
    h+=`<div class="panel respond">${C.pending.items.map((it,i)=>{ const cands=myCreatures(allHeroCreatures().filter(b=>canBlock(b,it.a)));
      const blkMine=!it.blk||minePi==null||it.blk.owner===minePi;
      return `<div class="atkrow ${C.sel===i?'sel':''} ${it.cancel?'cancel':''}" data-a="bSel" data-v="${i}"><b>${esc(srcName(it))}</b> (${atkOf(it)} ATK${!it.a.cmd&&has(it.a,'fly')?', Flying':''}${!it.a.cmd&&has(it.a,'trample')?', Trample':''}) → ${esc(FP(it.tgt).name)} ·
       ${it.blk?`blocked by <b>${esc(it.blk.name)}</b>${blkMine?` <button class="btn small" data-a="bAssign" data-v="${i}:">unblock</button>`:''}`:'unblocked'}
       ${cands.filter(b=>b!==it.blk).map(b=>`<button class="btn small" data-a="bAssign" data-v="${i}:${b.uid}">Block with ${esc(b.name)} (${effAtk(b)}/${hpLeft(b)})</button>`).join('')}</div>`; }).join('')}
      <button class="btn primary glow" data-a="bConfirm">Confirm blocks</button></div>`;
  }
  // player battlefields; two or more sit side by side on desktop so cards aren't cut off
  if(C.fighters.length>1) h+=`<div class="hero-fields">`;
  C.fighters.forEach((Fx,fi)=>{ const p=FP(Fx); const isA=F===Fx; const mine=!TOWN.on||Fx.pi===TOWN.localPi;
    const label=(C.fighters.length>1?`${esc(p.name)}'s battlefield`:'Your battlefield')+`<span class="field-stats"> · ❤ ${p.hp}/${p.maxHp} · 🛡 ${Fx.block} · 💧 ${Fx.mana} mana · draw ${Fx.draw.length}</span>`;
    const cards=Fx.field.map(c=>{ let attrs='';
      if(C.phase==='block'&&C.pending&&mine){ attrs=`data-a="bAssign" data-v="${C.sel||0}:${c.uid}"`; }
      else if(isA&&mine&&C.step==='attack'&&!c.tapped) attrs=`data-a="cToggleAtk" data-v="${c.uid}"`;
      else if(isA&&mine) attrs=`data-a="cAlly" data-v="${c.uid}"`;
      return crHTML(c,{atk:isA&&Fx.atkSel[c.uid],ally:isA&&Fx.ally===c.uid,attrs}); });
    h+=`<div class="battle-row ours ${isA?'act':''}${Fx.out?' is-out':''}${mine?' is-mine':''}"><div class="muted">${label}</div>${fieldHTML(cards)}</div>`;
  });
  if(C.fighters.length>1) h+=`</div>`;
  h+=`</div></div>`; // combat-fields + combat-table

  const showHand=!TOWN.on||(F&&F.pi===TOWN.localPi);
  h+=`<div class="combat-hand">${showHand&&F?fighterBonusHTML(F):''}`;
  if(F&&!C.over&&!showHand){
    h+=`<div class="row hand-actions waiting"><span class="muted">It's ${esc(FP(F).name)}'s turn. Your hand is hidden from your teammate, and theirs is hidden from you.</span></div>`;
  } else if(F&&!C.over){
    if(C.step==='attack'){ const n=Object.values(F.atkSel).filter(x=>x).length; const canAtk=F.field.some(c=>!c.tapped); h+=`<div class="row hand-actions"><button class="btn danger${n>0?' glow':''}" data-a="cDeclare">⚔️ Attack with ${n} creature${n===1?'':'s'}</button><button class="btn${canAtk?'':' primary'} glow" data-a="cSkip">Don't attack</button></div>`; }
    else {
      h+=`<div class="combat-hand-rows"><div class="hand-block"><div class="muted hand-label">Your hand (Basic Strike + ${F.hand.length}/${HAND_BOUGHT} bought cards):</div><div class="cards play-row" style="--hand-n:${1+F.hand.length}">`;
      { const ssrc=artPath('hc','strike'); const scls=`card spell ${ssrc?'artcard':''} ${F.strikeUsed?'cant':'play'}`; const sattrs=`style="--i:0"${F.strikeUsed?'':` data-a="cStrike"`}`;
        h+= ssrc
          ? `<div class="${scls}" ${sattrs} data-zoom="${esc(ssrc)}" title="Basic Strike: Deal 2 damage to your target. Gain 1 Block. Never spent.">${faceImg(ssrc,'Basic Strike')}${zoomBtn(ssrc)}</div>`
          : `<div class="${scls}" ${sattrs}><div class="mana">0</div><div class="cname">Basic Strike</div><div class="ctype">✨ free · once per turn</div><div class="ctext">Deal 2 damage to your target. Gain 1 Block. Never spent.</div></div>`; }
      F.hand.forEach((x,i)=>{ const w=whyNot(F,x,false); h+=cardHTML(x,{F,play:!w,cant:!!w,why:w,attrs:`style="--i:${i+1}"${w?'':` data-a="cPlay" data-v="${i}"`}`}); });
      h+=`</div></div><div class="hand-block"><div class="muted">Mana hand (play 1 per turn${F.manaThisTurn?' — already played this turn':''}):</div><div class="cards mana-row">${F.manaHand.map((id,i)=>manaCardHTML(id,{play:!F.manaThisTurn,cant:F.manaThisTurn,attrs:F.manaThisTurn?'':`data-a="cMana" data-v="${i}"`})).join('')||'<i class="muted">all mana in play</i>'}</div></div></div>`;
      h+=`<div class="row hand-actions"><button class="btn primary glow" data-a="${C.step==='main1'?'cCombat':'cEnd'}">${C.step==='main1'?'Combat ▶':'End turn ▶'}</button>${hasRelic(FP(F),'bloodPact')?`<button class="btn" data-a="cPact" ${F.flags.pact||FP(F).hp<=2?'disabled':''}>Blood Pact: 2 HP → 1 mana</button>`:''}${F.field.filter(c=>c.def.sacMana).map(c=>`<button class="btn small" data-a="cSac" data-v="${c.uid}">Sacrifice ${esc(c.name)} for 1 mana</button>`).join('')}<button class="btn small" data-a="cRetreat">Retreat (−2 gold)</button></div>`;
    }
  }
  if(C.phase==='block'&&!C.over){
    C.fighters.forEach((Fx,fi)=>{ if(Fx.out) return;
      if(TOWN.on&&Fx.pi!==TOWN.localPi) return;
      const inst=Fx.hand.map((x,i)=>({x,i})).filter(o=>HC[o.x.id].type==='instant');
      if(inst.length) h+=`<div class="muted">Instants (${Fx.mana} mana left):</div><div class="cards">${inst.map(o=>{ const w=whyNot(Fx,o.x,true); return cardHTML(o.x,{F:Fx,play:!w,cant:!!w,why:w,attrs:w?'':`data-a="bInstant" data-v="${fi}:${o.i}"`}); }).join('')}</div>`;
    });
  }
  h+=`</div>`;
  if(TOWN.on&&TOWN.help) h+=howtoHTML();
  h+=`</div></div>`;
  return h;
}

// ===== Input =====
function act(a,v,fromPi){
  UI.err=null;
  UI.actorPi=(fromPi!=null&&fromPi!=='')?+fromPi:(TOWN.on?TOWN.localPi:null);
  if(!TOWN.on || UI.actorPi===TOWN.localPi) UI.forceHandRender=true;
  try{
    switch(a){
      case 'restart': if(!G||G.over||confirmRestart()){ G=null; UI.deckView=null; } break;
      case 'setCount': UI.setup.count=+v; break;
      case 'setFac': { const [i,f]=v.split(':'); UI.setup.facs[+i]=f; break; }
      case 'setDeck': { const [i,d]=v.split(':'); UI.setup.decks[+i]=d; break; }
      case 'setDiff': UI.setup.diff=v; break;
      case 'setOrder': UI.setup.drawOrder=v; break;
      case 'start': { const S=UI.setup; newGame(S.count,S.facs.slice(0,S.count),S.names.slice(0,S.count),S.decks.slice(0,S.count),S.diff,S.drawOrder); break; }
      case 'roll': rollMove(); break;
      case 'stay': stayPut(); break;
      case 'move': moveTo(v); break;
      case 'action': { const [x,y]=v.split('|'); doAction(x,y===''?null:y); break; }
      case 'errand': doErrand(v); break;
      case 'endTurn': endTurn(); break;
      case 'closeModal': closeModal(); break;
      case 'buy': shopBuy(+v); break;
      case 'forgeTab': { const m=G.modals[0]; if(m) m.tab=v; break; }
      case 'forgeReveal': forgeReveal(); break;
      case 'upgrade': { const [u,uid]=v.split(':'); forgeUpgrade(+u,uid); break; }
      case 'melt': forgeMelt(+v); break;
      case 'tbuy': tavernBuy(v); break;
      case 'tquest': tavernQuest(+v); break;
      case 'ruinsStack': ruinsPickStack(v); break;
      case 'ruinsTake': ruinsTake(+v); break;
      case 'call': callFight(v); break;
      case 'callResp': { const [i,y]=v.split(':'); callRespond(+i,y==='1'); break; }
      case 'callGo': callGo(v==='1'); break;
      case 'viewDeck': UI.deckView=+v; break;
      case 'closeDeck': UI.deckView=null; break;
      case 'cTarget': setTarget(v); break;
      case 'cAlly': setAlly(v); break;
      case 'cToggleAtk': toggleAttacker(v); break;
      case 'cDeclare': declareAttack(); break;
      case 'cSkip': declareAttack([]); break;
      case 'cCombat': goToCombat(); break;
      case 'cStrike': playStrike(); break;
      case 'cPlay': playCard(+v); break;
      case 'cMana': playMana(+v); break;
      case 'cEnd': endHeroTurn(); break;
      case 'cRetreat': retreat(); break;
      case 'cPact': bloodPact(); break;
      case 'cSac': sacThrall(v); break;
      case 'bSel': if(G.combat) G.combat.sel=+v; break;
      case 'bAssign': { const [i,u]=v.split(':'); if(G.combat){ G.combat.sel=+i; assignBlock(+i,u); } break; }
      case 'bInstant': { const [fi,i]=v.split(':'); playCard(+i,+fi); break; }
      case 'bConfirm': confirmBlocks(); break;
      case 'leave': leaveCombat(); break;
      case 'zoom': showCardZoom(v, true); return;
      case 'closeZoom': hideCardZoom(true); return;
    }
    if(G&&G.combat) combatTick();
    autoAdvance();
  }catch(e){ UI.err=(e&&e.stack)||String(e); if(typeof console!=='undefined') console.error(e); }
  render();
}
function confirmRestart(){ try{ return window.confirm('Abandon this game and start over?'); }catch(e){ return true; } }
// ===== Town-map embed (iframe from the 3D town). Host runs the engine; clients send actions and apply the host's copies. =====
const TOWN={on:false, role:'solo', localPi:0, closed:false, lastWon:null, help:false};
if(typeof location!=='undefined' && new URLSearchParams(location.search).has('embed')){
  TOWN.on=true;
  if(typeof document!=='undefined') document.documentElement.classList.add('embed');
}
function townPost(msg){ if(typeof window==='undefined'||!window.parent||window.parent===window) return; window.parent.postMessage(Object.assign({source:'thornhold-battle'}, msg), '*'); }
function townMaybeResult(){ if(G&&G.combat&&G.combat.over&&TOWN.lastWon===null){ TOWN.lastWon=G.combat.won; townPost({k:'result', won:TOWN.lastWon}); } }
function townApply(a,v,fromPi){ act(a,v,fromPi); townMaybeResult(); }
function townClick(a,v){
  if(a==='townHelp'){ TOWN.help=true; render(); return; }
  if(a==='townHelpClose'){ TOWN.help=false; townHelpRemember(); render(); return; }
  if(a==='zoom'||a==='closeZoom'){ act(a,v); return; }
  if(a==='leave'){
    TOWN.closed=true; townPost({k:'over', won:TOWN.lastWon});
    if(G&&G.combat) act('leave');
    render(); return;
  }
  if(TOWN.role==='client'){ townPost({k:'act', a, v, pi:TOWN.localPi}); return; }
  act(a,v,TOWN.localPi);
  if(TOWN.role==='host') townPost({k:'act', a, v, pi:TOWN.localPi});
  townMaybeResult();
}
if(typeof window!=='undefined'){
  window.TownFight={
    start(cfg){ if(G&&G.combat&&!TOWN.closed) return; TOWN.role=cfg.role||'solo'; TOWN.localPi=cfg.localPi||0; TOWN.closed=false; TOWN.lastWon=null; TOWN.help=!townHelpSeen(); startTownFight(cfg); render(); },
    apply(a,v,fromPi){ townApply(a,v,fromPi); },
    getState(){ return G; },
    setState(s){ G=s; render(); },
  };
  window.addEventListener('message', ev=>{
    if(!TOWN.on||!ev.data||ev.data.source!=='thornhold-town') return;
    const m=ev.data;
    if(m.k==='start') window.TownFight.start(m.cfg);
    else if(m.k==='act') window.TownFight.apply(m.a, m.v, m.pi);
  });
}
if(typeof document!=='undefined'){
  document.addEventListener('click',e=>{ const el=e.target.closest('[data-a]'); if(!el) return; e.stopPropagation(); if(TOWN.on) townClick(el.dataset.a, el.dataset.v); else act(el.dataset.a, el.dataset.v); });
  document.addEventListener('input',e=>{ const t=e.target; if(t&&t.dataset&&t.dataset.name!==undefined) UI.setup.names[+t.dataset.name]=t.value||('Player '+(+t.dataset.name+1)); });
  window.TH={get G(){return G;}, forgeReveal, act, newGame, startTownFight, setSeed, render, reachable, getActions, activeF, HC, P, callTargets, showCardZoom, hideCardZoom, TOWN, awakenToUrsanox, damageCreature, canAwaken, exileHighestUntilLeave};
  const boot=()=>{ ensureZoom(); if(TOWN.on){ document.body.classList.add('embed'); townPost({k:'ready'}); } render(); };
  document.addEventListener('DOMContentLoaded', boot);
  if(document.readyState!=='loading') boot();
}
</script></body></html>
